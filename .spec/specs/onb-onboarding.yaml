kind: spec
prefix: ONBS
title: Lazy Onboarding — behavior
status: draft
challenge:
  date: 2026-07-29
  by: "cortex:challenge — three-lens panel, round 3 (the single-producer design)"
  verdict: fail
  record: .spec/specs/challenges/onb-onboarding-2026-07-29-r3.md
  summary: >-
    Three lenses, all fail, all locating the SAME region independently. Four consecutive
    rounds of highs in the bounds / acceptance / failure-handling region — the region Q-18
    already defers — which the stopping rule names a scope error, not a wording error. The
    mechanism, stated by the code-executing lens: each repair moved the blindness one level
    rather than removing it (nothing measured -> total produced -> forward occupancy ->
    occupancy is blind to DISTRIBUTION, first post on day 21 with the clause green at
    12/12). DEC-48's architecture HELD under all three, and one lens looked for a cheaper
    one and reported there is none. Remedy, named independently by two lenses and taken as
    DEC-49: ship the invoker, defer the metering region to its own chain.
intent: >-
  Exact behavior of onboarding (register onb-onboarding.yaml): how an org starts
  from name + email with nothing blocking (ONB-1), how public sources are
  ingested into Memory and seed the Strategy (ONB-2), how the gap model drives
  the interview (ONB-3), how channels connect on OAuth any time (ONB-4), how the
  "here's what I know" review turns corrections into permanent rules (ONB-5), and
  how first drafts land inside the first session on minimum viable context
  (ONB-6). This spec covers the ENGINE beneath the ALREADY-APPROVED day-one
  experience (journey XO-1); NEW pixel-level UI detail is a separate method/ui.md
  pass on those approved screens (named in open-questions).
design-scope: cross-cutting
constrained-by: [ADR-0002, ADR-0003, DM-1, DM-2, DM-3, DM-5, DM-14, PIPE-1, ARC-12, ARC-18, ARC-28, XH-12, IG-1, IG-2, IG-6, IG-7, SEC-3, SEC-4, SEC-10]
depends-on: [MEMS]
governed-by: [GR-6, GR-7]
assurance: standard

design: >-
  Module @backend/onboarding (ARC-12) orchestrates signup, 501(c)(3)
  verification, source ingestion, the gap model, and the channel-connect flow.
  It is a THIN ORCHESTRATOR over shared services, not a second brain: Memory
  (MEMS write/retrieve — the single source, DEC-22), the Strategy style seed
  (STR-2 / STRS-2), the Interviewer (INT, which consumes the gap model), and the
  integration adapters behind ports (ADR-0003) — ProPublica/IRS (IG-6), the
  website scraper (IG-7), Meta (IG-1), X (IG-2). Extraction and org-name matching
  are LLM steps in the shared pipeline (PIPE-1) via the ADR-0003 port, grounded
  and source-pointed. ChannelConnection (DM-14) is the connect flow's output and
  the Publisher's (ARC-18) input for PUB-1. The founder-facing surfaces are the
  ALREADY-APPROVED day-one experience — journey XO-1: doorstep (XO-6) →
  day-one home (XH-12); flows arrival & watch it learn (XO-2), the first
  conversation + "here's what I know" (XO-3), first drafts + connect-in-context
  (XO-4), meet the plan (XO-5). This spec is the backend behavior beneath
  them. Boundaries: reads public presence only, with signup consent (A-5, SEC-3);
  no third-party PII (SEC-3); official platform APIs only (GR-6); no fabrication
  (the LRN-20 grounded-guard + catch-rate pattern, applied per element).
  NON-BLOCKING INVARIANT: every step — verification, ingestion, connect, review —
  is skippable and resumable. The ONLY hard predecessor of first drafts (ONBS-6)
  is the minimum-viable-context predicate, never the completion of any onboarding
  step. This is what makes "no homework" (VAL-6, ONB-1) STRUCTURAL rather than
  aspirational: there is no code path where an unfilled field gates the product.

data: >-
  DM-1 Org (created from name + email; carries verification status + pulled
  registry data). DM-2 MemoryEntry (ingested facts/style, each source-pointed and
  assumed-marked). DM-3 StrategyDoc (the ingestion style seed, STR-2). DM-14
  ChannelConnection (one per authorized channel; credentials are encrypted org
  secrets, SEC-10). The gap model is a DERIVED VIEW over Memory coverage (not a
  separate entity), keyed into the MEMS-6 asked-set. Concrete field lists live in
  @shared types at implementation.

interfaces: >-
  @backend/onboarding (ARC-12) exposes: startSignup(name, email) -> Org [creates
  DM-1, non-blocking]; verifyNonprofit(org, ein?) -> status + registry data
  [IG-6; a name-derived match returns a PROPOSAL for founder confirmation, never
  auto-bound]; ingestSources(org, sources) -> writes facts+style to Memory, seeds
  the Strategy [IG-1/IG-7 -> MEMS-1, STR-2]; purgeWrongOrg(org) -> clean delete
  [MEMS-2]; computeGaps(org) -> the gap model [caller: INT]; connectChannel(org,
  platform) / reconnectChannel(org, platform) -> ChannelConnection [DM-14; OAuth];
  getProfileForReview(org) and applyCorrection(change) -> writes to Memory
  [MEMS-1]; readyForFirstDrafts(org) -> boolean [the ONBS-6 predicate; caller:
  GEN]. Exact tRPC/WS/OAuth-callback signatures live in code.

items:
  ONBS-1:
    v: 1
    title: Zero-homework signup and 501(c)(3) verification
    implements: [ONB-1]
    statement: >-
      The Org (DM-1) is created from name + email alone; NOTHING downstream
      blocks on missing fields (VAL-6, ONB-1) — verification and ingestion run
      behind the already-working home (XO-2). EIN is OPTIONAL. When the founder
      provides an EIN, or the system CONFIDENTLY matches the org name to a single
      registry record, it verifies 501(c)(3) status and pulls registry data via
      ProPublica/IRS (IG-6, A-4). Org-name -> EIN matching is a fuzzy/LLM step
      with a residual error rate (LRN-20): a system-DERIVED match is a PROPOSAL
      the founder confirms before it is treated as the org's verified identity —
      the system never silently binds a wrong EIN; a founder-PROVIDED EIN is
      verified directly. Verification STATUS is a fact surfaced honestly
      (verified | pending | unmatched | already-registered — XO-2 states),
      never a gate; a failed or blocked lookup degrades to "unverified" without
      blocking and without fabricating registry data.
      ACCEPTANCE: an org with only name + email reaches a working home and first
      drafts (ONBS-6) with verification still pending; a name-matched EIN is never
      persisted as identity without founder confirmation; a failed lookup yields
      "unverified" with no fabricated data and no block.
  ONBS-2:
    v: 1
    title: Source ingestion into Memory, seeding the Strategy
    implements: [ONB-2]
    statement: >-
      When sources are connected or named, a pipeline SCRAPES the website (IG-7)
      and HARVESTS the org's Meta accounts — FB / Instagram / Threads (IG-1) —
      extracting FACTS
      (mission, programs, people, events) and STYLE (tone, vocabulary, post
      patterns, imagery style) and writing them to Memory through the MEM-1 write
      path (MEMS-1). Every ingested entry is an INFERENCE, not ground truth: it
      carries provenance pointing at the source artifact and is marked assumed
      (DS-5 AssumedNote) for the ONBS-5 review. Extraction is an LLM step
      (LRN-20): an entry with no resolvable source pointer is not written, and a
      labeled catch-rate test on a fabricated-extraction set guards grounding — a
      grounded-extraction guard + catch-rate, not an un-failable "never
      hallucinates". Style findings SEED the Posting Strategy (STR-2)
      one-directionally; the seed is founder-editable afterward (STRS-2) and is
      not re-derived over the founder's edits. X style is NOT harvested at
      launch: the committed X integration (IG-2) is write-only (A-2), so X voice
      leans on the shared cross-channel style seed rather than the org's own X
      timeline until read access is budgeted (Q-13) — a best-effort gap surfaced,
      not a silent assumption. Only the org's PUBLIC presence is
      read, under signup consent (A-5, SEC-3); no third-party PII is stored
      (SEC-3). A "this isn't us" action triggers the deterministic wrong-org purge
      (MEMS-2) — a clean hard-delete of the mis-ingested entries. Thin, slow, or
      failed sources degrade honestly and non-blockingly (XO-2); no sources at
      all routes to the interview as the primary path (ONBS-3, XO-3).
      ACCEPTANCE: ingested facts/style land in Memory each with a source pointer
      and an assumed mark; the Strategy shows a style seed derived from real
      posts; "this isn't us" leaves no residual entries; ingestion failure never
      blocks the home.
  ONBS-3:
    v: 1
    title: The gap model driving the interview
    implements: [ONB-3]
    statement: >-
      The system computes what it is MISSING as a structured GAP MODEL — the
      enumerable set of unknowns (identity, programs, people, stories, style,
      calendar) — recomputed as sources and answers arrive. This gap model is the
      SINGLE source the Interviewer (INT-1/INT-2) draws its questions from AND the
      same structured-unknown taxonomy the never-ask-twice asked-set keys against
      (MEMS-6): ONB-3 OWNS the taxonomy, INT CONSUMES it, MEMS-6 KEYS it — one
      source, no second copy (the DEC-22 discipline). No setup CHECKLIST is ever
      shown as homework (VAL-6, R-10): gaps surface only as the colleague's
      curiosity (INT) and the always-available, dismissible open-questions list
      (INT-4), each tied to why it helps. The product simply improves as gaps
      close; completeness is never presented as a task.
      ACCEPTANCE: with sources thin the gap model is non-empty and the interview
      is driven entirely by it; a filled gap stops being asked (MEMS-6); no
      onboarding step presents a checklist/homework surface (the product-wide
      no-empty-state guarantee is VAL-6).
  ONBS-4:
    v: 1
    title: Channel connect — OAuth, any order, never a gate
    implements: [ONB-4]
    statement: >-
      OAuth connect flows for FB Page, Instagram, Threads (IG-1, Meta) and X
      (IG-2) are available in ANY order at ANY time and are NEVER a gate (VAL-6,
      ONB-1). A successful connection persists a ChannelConnection (DM-14) owned
      by the org, its credentials encrypted org secrets (SEC-10). A destination
      ACTIVATES for publishing (PUB-1, read by the Publisher ARC-18) exactly when
      a healthy ChannelConnection exists: zero connections means drafts still flow
      and publishing waits (ONBS-6 is decoupled from connection); partial
      connection is normal for week one. Connection health is a first-class,
      DETERMINISTIC state machine (connected | expired | revoked | error): an
      OAuth failure at connect time gets a plain-language retry; a LATER token
      expiry or revocation becomes a pinned needs-you card with its reason
      (XO-4, SEC-10) — the founder never discovers a dead channel silently — and
      re-auth reuses this same flow. Official platform APIs only (GR-6).
      ACCEPTANCE: a channel connects independently of any other onboarding step
      and of draft generation; an approved draft for an unconnected channel holds
      (never errors) until connection; an expired token raises exactly one pinned
      needs-you card and is cleared by reconnect.
  ONBS-5:
    v: 1
    title: The "here's what I know" review — corrections become permanent rules
    implements: [ONB-5]
    statement: >-
      The assembled profile (facts, tone, programs, people — from ONBS-2) is
      presented for correction with every inference marked assumed (DS-5
      AssumedNote, XO-3). A founder correction is written through the MEM-1
      write path (MEMS-1) as a PERMANENT rule: a factual fix SUPERSEDES the
      inferred entry (MEMS-2 supersession — retained, not overwritten, VAL-3); a
      correction phrased as a PROHIBITION becomes a taboo/styleRule enforced
      everywhere Memory is (MEMS-3, the DEC-22 single source enforced by the GR-8
      backstop). The review is NOT a gate: it is available and resumable, and an
      un-reviewed profile still grounds drafts — its entries simply stay marked
      assumed. This is the onboarding entry to the SAME correction path chat
      (CHT-2) and approvals (APR-3) use — one write path, one source.
      ACCEPTANCE: correcting an inferred fact supersedes it and the old form never
      resurfaces in generation; a correction phrased as a prohibition is
      thereafter enforced by the taboo overlay (MEMS-3); skipping the review does
      not block drafts.
  ONBS-6:
    v: 3
    title: First proof, lazily — the minimum-viable-context predicate
    implements: [ONB-6]
    reach: required
    statement: >-
      First drafts generate as soon as MINIMUM VIABLE CONTEXT exists — a defined,
      checkable predicate: enough grounded Memory to write on-mission (at least
      the identity plus one program- or story-level fact) AND a seed Strategy
      (STR-2, even the ingestion-seeded default). The trigger is met from sources
      alone, or from the first ~ten minutes of interview when sources are thin.
      The target is first drafts INSIDE the first session and a live post within
      48 hours (G-5). It never blocks on completeness (ONB-1): with only
      cause-level Memory it still produces drafts, honestly grounded and marked
      thin (MEMS-4 degradation, consistent with TOPS-1) rather than fabricating
      specifics; drafts sharpen as Memory deepens. The predicate is evaluated
      DETERMINISTICALLY (the gate is a checkable boolean — readyForFirstDrafts);
      draft QUALITY is the LLM part downstream.
      IT IS A CONJUNCTION, AND EVERY CONJUNCT NEEDS A PRODUCER (v3, DEC-48). The
      two conjuncts are not symmetric in the code: Memory has a write path with
      many callers, while the seed Strategy had NO producer at all — ONBS-2 claims
      ingestion seeds STR-2 and the implementation writes Memory only, with the gap
      recorded in a code comment rather than in the graph. A gate whose conjunct is
      never made true is a gate that never opens, so "first drafts as soon as
      context exists" would have stayed false for every real org while passing in
      test, because the demo seed writes the row. This is the third instance of one
      class in this delta's history — the planner had no caller (INC-12), then the
      agenda run had no caller, then this. GENS-8 therefore ENSURES BOTH CONJUNCTS
      before planning, and the rule is stated rather than left as a habit: EVERY
      CONJUNCT OF A GATING PREDICATE NEEDS A NAMED PRODUCER, NOT JUST A NAMED
      OBSERVER.
      WHO EVALUATES IT (v3, DEC-48 superseding DEC-44's observer): a recurring
      unattended SWEEP, not a page view and not a post-commit observer. The gap
      that falsified this element's acceptance was that nothing watched the
      predicate — it was only ever read to choose the home's shape. An observer
      would have fixed that and introduced a worse defect: ingestion commits PER
      ARTIFACT, so a post-commit observer fires on the second qualifying fact while
      nineteen more are still being scraped, planning the founder's whole first
      impression from two facts. So the predicate is additionally read as SETTLED,
      which means NO INGESTION RUN IS IN FLIGHT for the org — deliberately NOT "no
      predicate-feeding write inside the last interval", because every interview
      answer is such a write and a founder answers well inside five minutes, so that
      form starves the interview path for exactly as long as the founder stays
      engaged, and the interview is the path this element names when sources are
      thin. The sweep, its bounds and its failure handling are GENS-8's (ARC-28);
      this element owns only the predicate and the promise.
      THE DAY-ONE NARRATION PERSISTS UNTIL THE FIRST DRAFTS LAND OR VISIBLY FAIL —
      never unboundedly. Decoupling the predicate from generation opens a window in
      which the home would otherwise leave day-one shape while Ready is empty and
      generation is in flight: an empty state against VAL-6 and DS-6. But a wait
      with no terminal branch is its own failure — if generation dies, the founder
      watches "first drafts in about ten minutes" forever. So the narration has a
      bound, after which it switches to the honest snag register XO-2 already
      establishes for a failed source ("that didn't work — I'll retry; meanwhile,
      tell me…"), never a silent spinner and never a lie about timing. It also has a
      RETURN branch, and under GENS-8's interim rule it is reachable by construction:
      the sweep re-attempts the org on its next calendar day, so a later successful
      attempt replaces the snag narration with the arriving cards. A snag state with
      no exit is the same defect as a wait with no bound — which is why this element
      does NOT rest on a durable snag flag: that machine and its clearing condition
      are deferred with the metering region (Q-19), and until it lands "the sweep
      tries again tomorrow" IS the exit. Note XO-2's own states
      cover the INGESTION wait, not generation-in-flight, generation-failed, or
      generation-recovered; this element adds those three.
      THE NARRATION NEEDS A DELIVERY CHANNEL, NOT JUST A CONDITION (v3). The client
      neither polls nor subscribes, and the onboarding refresh does not invalidate
      the Ready stack — so today the predicate flips on ingest success, the home
      leaves day-one shape, and drafts landing a minute later are never fetched.
      Whichever way XH-12 settles the transition, the transition must be
      OBSERVABLE: an open session learns that drafts landed without a manual
      reload, by a push on the realtime channel (ARC-2's WS) or a bounded poll
      while the org's generation is in flight. THAT MECHANISM IS APRS-7's — named
      rather than left to float, because a requirement with no owning element is
      exactly how this half stayed unbuilt while the roll-up read green: no story
      served ONB-6, so its story quantifier was vacuously true. The day-one->steady TRANSITION
      CONDITION itself is XH-12's to own and is registered as INC-13; this element
      owns the behavioural half and the requirement that a channel exist, and it
      LANDS WITH XH-12's condition, not before it — shipping the narration rule
      alone would paint the day-one wait on top of the steady terminus copy INC-13
      describes, two truths on one screen.
      ACCEPTANCE, as separable clauses (no clause may be un-failable — LRN-30):
      (a) drafts are PRESENT inside the first-session window — note this is
      upstream of G-5 v2's interim measure, which counts a first APPROVED post;
      this element delivers the drafts that make approval possible, and claiming
      the activation measure itself would overstate what ONBS-6 owns;
      (b) generation COMPLETES WHILE NO CLIENT SESSION IS CONNECTED for that org —
      close the client, drain the queue, reassert — which is the honest form of
      "unattended", unlike "no button was pressed" (a property of the test author,
      not the system, and therefore never red);
      (c) the arriving item is provably from the planner path — it carries a planner
      slot date (`scheduledFor` set), which the composer never sets;
      (d) the predicate is explicit and deterministic, AND an org for which only ONE
      conjunct EXISTS AT THE MOMENT IT IS READ does not pass it — asserted by reading
      the predicate directly against such an org, never by driving ingestion and
      observing no drafts, which is true by construction now that the producer is a
      sweep and would pass even if the sweep ignored the predicate entirely. This
      does not mean such an org receives nothing: GENS-8 ensures the missing conjunct
      BEFORE the read, so the predicate's job is to catch a FAILED ensure, and
      GENS-8 (b) is what asserts the drafts arrive;
      (e) thin Memory yields honest cause-level drafts, never fabricated impact;
      (f) generation failing terminally leaves the founder with the honest snag
      state, never an unbounded "first drafts in about ten minutes" — and when it
      later succeeds the snag state is replaced, not left standing beside the cards;
      (g) AN OPEN SESSION OBSERVES THE ARRIVAL WITHOUT A MANUAL RELOAD — the
      mechanism is APRS-7's (this is a backend spec and cannot carry a client
      marker) and US-20 is the founder-seat story that validates it. Fails today:
      there is no poll and no subscription, so the assertion is red against the
      current client, which is what makes it worth stating.

  ONBS-7:
    v: 1
    title: The calibration frame — drafts written before the founder has corrected anything
    implements: [ONB-6]
    statement: >-
      DRAFTS PRODUCED WHILE STEWARD IS UNCALIBRATED ARE OFFERED AS A FIRST
      ATTEMPT, NOT AS FINISHED WORK (v1, DEC-48, extracted from ONBS-6 which
      carried this as one of three concerns). They arrive with no gate and nothing
      to click — a confirm-the-profile step would be exactly the wizard XO-1
      forbids — but they are FRAMED ("here's my first go — tell me what's off")
      rather than presented like the steady-state stack. Three reasons this is
      behaviour and not decoration: it is honest at the moment Steward knows least
      about how this founder writes; it invites the correction that MEM-1 turns
      into a permanent rule, so a rejected first draft IMPROVES the next batch
      instead of reading as failure; and it protects G-2 (approval-without-edits by
      week 8) from being judged against drafts written before any correction existed.
      UNCALIBRATED IS THE PREDICATE, AND IT IS DEFINED HERE BECAUSE NOTHING ELSE
      DEFINED IT. An org is UNCALIBRATED while its Memory holds no styleRule or
      taboo WHOSE SOURCE TRIGGER IS ONE OF THE EXPLICIT CORRECTION CHANNELS MEMS-1
      v2 enumerates — an APR rejection, an inline edit, a skip-reason, a CHT
      confirmed redirect, an ONBS-5 review correction. Keyed on the DURABLE SOURCE
      TRIGGER, not on the entry KIND and not on a call-time flag: the kind alone is
      wrong because ingestion legitimately writes style findings as styleRule
      entries, and a call-time correction flag is not persisted at all, so neither
      can be read back. EVERY OTHER PROVENANCE LEAVES THE ORG UNCALIBRATED —
      ingestion, interview, bot, media upload, discovery triage, and dev-seed
      included. Naming dev-seed matters: the demo fixture writes a taboo, so a
      predicate keyed on kind would make every seeded org read as calibrated and
      leave clause (a) with no reachable subject.
      WHY NOT A MEMORY-VOLUME THRESHOLD, which is what "still thin" invited and
      what the round-7 panel proved unusable. (i) The two existing carriers of
      "thin" attributed to this capability are the exact COMPLEMENT of
      readyForFirstDrafts — ready requires identity plus one program/story fact,
      i.e. ≥2 grounding entries, and the code treats <2 as thin — so keying on them
      makes the rule fire for exactly no item, and every clause testing it
      vacuously true. (ii) MEMS-4's thinness signal fires on EMPTY Memory, a third
      meaning; "thin" carried three, breaching the semantic-clarity rule. (iii) Any
      volume threshold is WRONG FOR THE PRIMARY PATH: the audit's own evidence org
      yielded twenty-one accurate Memory entries from one website scrape, so it is
      not thin by any count — yet Steward had never been told a single thing about
      how that founder wants to sound, which is precisely what the frame is
      confessing. VOLUME OF FACTS IS NOT KNOWLEDGE OF VOICE. Keying on correction
      history tracks the thing the framing is actually about. IT NEEDS TWO EXITS,
      not one: the first correction — the same event the second reason above is
      built on — OR, for the founder who simply approves everything, the org's first
      N disposed items. A correction-only exit never fires for G-2's own SUCCESS
      state (approval without edits), so the frame would still be printing "here's my
      first go, tell me what's off" at week forty.
      IT IS KEYED TO THE ORG'S STATE, NOT TO THE PRODUCER. Every item generated
      while the org is uncalibrated carries the flag — not merely the ones some
      designated "first" run wrote. Producer-keying looks equivalent and is not: the
      sweep reaches the same uncorrected org tomorrow morning, so framed cards would
      be followed by unframed ones presented as finished steady-state work, which
      inverts all three reasons above. (This is why the producer's own clauses may
      never stamp by producer identity, and why there is only one producer to
      confuse it with.)
      THE FLAG IS PER-ITEM, NOT A SURFACE MODE. The property belongs to the DRAFT:
      it is set at generation from the org's calibration state and RETIRES ON THAT
      ITEM'S OWN DISPOSITION. Approved and skipped both remove the item from the
      spine, so the branch that matters is REDIRECT — the item stays in Ready and is
      the one case where the frame is stale, because that leftover was written
      before the correction. Redirect must therefore CLEAR the flag on the item
      whose id it already receives; today `approval.redirect` discards that id,
      which is the carrier this rule needs and the reason it is stated rather than
      assumed. A surface-wide mode retired on the first tap would strip the frame
      from the still-undisposed siblings — which after a redirect are exactly the
      ones that still need it — while the sweep interleaves genuinely
      steady-state cards among them, indistinguishably. The flag is a DM-5
      ContentItem field, enumerated there alongside `qaStatus` (the OPSS-1
      precedent for a cross-capability flag on this entity).
      IT RENDERS THROUGH A NAMED DS ELEMENT, NOT A FAMILY (GR-7 v3 — inventing a
      component here would be a governed violation, and naming only a family leaves
      the implementer free to invent while the spec reads as conforming): DSS-8
      ReasonLine — "one quiet line under every system-initiated item stating WHY it
      exists, in first-person colleague voice" — which is exactly the shape of
      "here's my first go". The frame PREFIXES the reason text inside DSS-8's single
      slot (DSS-19 already fills it per-card from `reasonLine`) rather than
      replacing it: no new DSS-8 variant, and the card keeps the explanation the
      founder most needs on precisely the drafts written before any correction
      existed. Not DSS-22, which is the empty/loading zero-state pattern and the
      wrong altitude for a badge on a populated card. The card renders the frame
      WHILE THE FLAG IS SET — keyed on the flag, never baked into persisted copy,
      or clearing a boolean would change no pixel.
      ACCEPTANCE, each clause independently falsifiable (LRN-30):
      (a) EVERY item generated for an uncalibrated org carries the flag, whether it
      is the org's first produced item or the tenth on the fourth day — the clause
      that catches producer-keying, and it needs two runs on different days to fail,
      which no single-run assertion can see;
      (b) ONCE A CORRECTION-CHANNEL styleRule OR taboo EXISTS, no NEWLY generated
      item carries the flag — the negative half, and the only clause that can fail
      against an implementation that stamps unconditionally. Its absence is what let
      "the frame is keyed to context" pass while meaning nothing. Worded as the
      statement's predicate rather than as "a founder correction": an ONB-5 FACTUAL
      correction supersedes a fact (MEMS-2) and is neither a styleRule nor a taboo,
      so the broader wording would make statement and clause unsatisfiable together;
      (b2) THE FRAME RETIRES ANYWAY once the org has disposed of its first N items,
      whether or not a correction ever arrived — the second exit, without which
      G-2's success case never leaves the frame;
      (c) an ingested style finding does NOT calibrate the org: an org whose Memory
      holds only assumed, ingestion-sourced entries is still uncalibrated. The
      clause that keeps (b) from being satisfied by the scrape itself;
      (d) an item's flag is gone once THAT item is approved, skipped, or has a
      redirect recorded against it, while its undisposed siblings keep theirs — a
      deterministic per-item check;
      (e) clearing the flag changes the rendered card, because the frame is keyed on
      it rather than written into stored copy;
      (f) whether the framing READS as a colleague's first attempt is a keyed judge
      case, never a substring match (LRN-20).

open-questions:
  - >-
    A UI-detail pass (method/ui.md) over the already-approved day-one screens
    (doorstep XO-6, day-one home XH-12, flows XO-2, XO-3, XO-4, XO-5) — e.g. the exact
    AssumedNote affordance on the "here's what I know" card (ONBS-5) and the
    connect-in-context sheet (ONBS-4) — is separate from this backend spec, like
    MEM-3's deferred Knowledge browser. Not a blocker: the day-one experience
