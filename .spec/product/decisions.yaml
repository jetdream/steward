kind: decisions
prefix: DEC
title: Human-in-the-Loop Decision Log
status: approved

intent: >-
  The record of decisions a human made when the SDLC protocol required it
  (.spec/CLAUDE.md HITL policy): contradiction overrides, requirement changes
  and removals, flexibility-limiting choices, and genuine product/business
  calls. Distinct from ADR (technical decisions with alternatives, in adr/),
  INC (a detected contradiction), and Q (a still-open question): a DEC is a
  *made* human decision at product/scope/requirement altitude, with
  provenance. Product-altitude changes cite the authorizing DEC via
  `decided-by:`. Each item carries the decision (statement), who
  (by), when (date), and what it binds/authorizes/overrides (binds).

items:
  DEC-49:
    v: 1
    date: 2026-07-29
    by: founder (shpin.p@diffco.us)
    binds: [DEC-48, DEC-47, DEC-46, GENS-8, ONBS-6, ONBS-7, TOPS-1, DM-1, DM-5, ARC-28, GEN-1, ONB-6, Q-18, INC-11, INC-12]
    title: Ship the invoker; defer the metering region to its own change (the second scope review)
    statement: >-
      THE SECOND SCOPE REVIEW, and this time the region is unambiguous. Cortex
      mandated the first at three consecutive fails; DEC-47 split, DEC-48
      re-collapsed, and round 8 failed with twelve highs. What decides this is not
      the count — round 8 ran three lenses where earlier rounds ran one, so the
      count measures review depth. What decides it is WHERE they landed.
      THE TABULATION the stopping rule asks for:
      r5 the bounds; r6 the bounds x3; r7 the bounds x3 + the producers x3; r8 the
      bounds x5 + the producers x4. FOUR CONSECUTIVE ROUNDS concentrated in the
      bounds / acceptance / failure-handling region — which is the region Q-18
      already defers. Two of the three lenses independently recommended the same
      remedy without being asked for one.
      THE MECHANISM, stated by the code-executing lens and worth more than any
      single finding: each repair MOVED THE BLINDNESS ONE LEVEL rather than removing
      it. r6 — the clause measured nothing about accumulation, so it was fixed to
      measure total produced. r7 — total produced is capped identically by the rate
      for every placement strategy, so it was fixed to measure forward-window
      occupancy. r8 — occupancy is blind to DISTRIBUTION: latest-slot placement puts
      a new org's first post on DAY 21, three weeks of silence, with the clause
      reading 12 of 12 throughout. Simulated, not argued. And the argument that
      chose latest placement ("earliest overshoots") was measured BEFORE the rate
      existed; re-measured with it, earliest yields 20 items a month and four posts
      a week from week one, latest 17 and 0/0/0/4. A rule that was correct in one
      bound-set became wrong in another and nobody re-checked it. That is what a
      four-round cluster looks like from the inside.
      DECISION: SHIP THE INVOKER. GENS-8 narrows to what INC-11 and INC-12 actually
      require — a recurring job that, for a ready and settled org, ensures its
      preconditions and writes drafts nobody asked for, at the EARLIEST unfilled
      slot dates, bounded by an explicitly crude interim rule: at most one
      plan-and-draft attempt per org per calendar day, at most three items per
      attempt, stopping once the next 28 days already holds N. Earliest placement
      is not an optimization here — it is what makes G-5's 48-hour live post
      possible at all.
      DEFERRED to its own change and its own challenge chain, retained as Q-19 so
      the deferral stays visible and re-raisable (SDLC Phase C): the
      occupancy-to-N CONVERGENCE rule and its figures, the rolling production RATE,
      the PLACEMENT strategy beyond "earliest", the per-org FAILURE/SNAG state
      machine with its bound and its exit, and the N-slot-grid INTERFACE the
      convergence model needs and which planCalendar does not expose. Five of round
      8's twelve highs leave with that region. The precedent is measured: when
      DEC-46 deferred metering, five of eight findings from the preceding round
      disappeared with it.
      WHY THIS IS RIGHT AND NOT MERELY EXPEDIENT: the deferred region is the region
      that cannot be specified well without a running system. Q-18 already says so
      in its own words — "the number is a field observation, which is why it is
      decidable-by user and not derivable here." Four rounds of adversarial review
      have been spent deriving numbers that a week of cohort-1 data would settle,
      while the product writes nothing at all.
      WHAT DEC-48 ESTABLISHED AND THIS DOES NOT DISTURB: one predicate-gated sweep
      is the right architecture. All three lenses held it, one went looking for a
      cheaper design and reported plainly that there is none, and a double-fire was
      attempted against it and could not be built. COGS survives at ~$5-12/org/month
      against the <$25 target. The three-item count (DEC-47) stands.
      ALSO AUTHORIZED, because round 8 proved each is load-bearing rather than
      tidying: (1) the two ensures run BEFORE the readiness predicate is evaluated,
      not inside the branch it guards — the same defect LRN-37 was deposited about,
      committed in the change that deposited it; (2) SETTLED means "no ingestion run
      in flight", not "no predicate-feeding write in the last interval", which
      starved the interview path the moment a founder answered a question inside
      five minutes — and is strictly simpler; (3) EVERY client-callable producer is
      retired, not one — strategy.autoDraft and topics.identify survived under a
      heading that said none did; (4) an element owns the OBSERVATION CHANNEL and a
      story serves ONB-6, because no story served it and `satisfied` was quantifying
      vacuously; (5) DM-1 and DM-5 are bumped and cascaded.
  DEC-48:
    v: 1
    date: 2026-07-29
    by: founder (shpin.p@diffco.us)
    binds: [DEC-47, DEC-46, DEC-44, GENS-8, ONBS-6, TOPS-1, DM-5, ARC-28, GEN-1, ONB-6, TOP-1, INC-11, INC-12, Q-18]
    title: ONE producer on a short cadence — supersedes DEC-47's split, keeps its three-item count
    statement: >-
      SUPERSEDES DEC-47 DECISION 1 (the two-element split). DEC-47 DECISION 2 (three
      items on first contact) STANDS and is re-affirmed. Escalated under SDLC Phase C
      rather than adopted autonomously, because DEC-47 was a same-day human decision
      and an agent may not overturn one.
      WHAT THE ROUND-7 PANEL FOUND. Four lenses in parallel, two executing code:
      eight highs, and the split itself HELD — every lens declined to cut either new
      element further, and for the first time in the chain no prior high rebounded
      into its own region. So the split's diagnosis was right. But two findings
      falsified the design as written, and one offered a way out that no prior
      decision had weighed.
      THE ALTERNATIVE NOBODY HAD CONSIDERED. DEC-44 weighed button-vs-job. DEC-45/46
      weighed plan-vs-draft. DEC-47 weighed trigger-vs-refill. None weighed
      CADENCE-VS-OBSERVER. Collapsing both producers into ONE predicate-gated sweeper
      on a short cadence deletes six mechanisms that exist solely to manufacture
      exactly-once semantics: the once-only claim, the level-vs-edge rule, the atomic
      conditional claim committed with the enqueue, the bounded re-arm, the at-bound
      claim retention, and two durable DM-1 columns. Duplication is already prevented
      by three rules that survive either way — per-date idempotency, the occupancy
      target, and the production rate. That apparatus was the most expensive thing in
      the spec and the direct source of the highs in rounds 2, 6 and 7.
      IT ALSO FIXES A DEFECT THE OBSERVER DESIGN COULD NOT. Ingestion commits per
      artifact with no transaction, so a post-commit observer fires the instant the
      second qualifying fact lands — planning the founder's entire first impression
      from two facts while nineteen more are still being scraped. The observer's
      SPEED was a defect, not a feature. A poll can express QUIESCENCE (skip an org
      that is still changing) and an observer structurally cannot. That is the
      decisive argument: correctness, not simplicity.
      WHAT IS DELETED: the second element DEC-47 created was never committed and
      exists in no history, so it is dropped rather than superseded. GENS-8 v2
      becomes the single producer again.
      WHAT IS ALSO AUTHORIZED IN THIS CHANGE, because the panel showed each is
      load-bearing rather than tidying:
      (1) ONBS-6 SPLITS — the calibration flag becomes ONBS-7 with a NAMED thinness
      predicate. The flag was keyed to "still thin", no element defined it, and the
      codebase's two ONBS-6-tagged carriers of "thin" are the exact COMPLEMENT of
      readyForFirstDrafts (ready implies not-thin, exactly at the boundary), so the
      rule could never fire and its clauses were vacuously true. A rule cannot own a
      predicate until it is an element.
      (2) TOPS-1 gains the INVOKER of its maintenance run. Three rounds have now
      found the same class one link further up each time — the planner had no caller
      (INC-12), then the agenda run had no caller (r5), then the seed Strategy had no
      producer (r7-h6). The rule this change adopts, stated once so the class closes:
      EVERY CONJUNCT OF A GATING PREDICATE NEEDS A NAMED PRODUCER, NOT JUST A NAMED
      OBSERVER.
      (3) The REACHABILITY TIER is adopted now, not later. The panel's sharpest
      procedural finding: this delta exists because a green graph sat over an
      unreachable capability, and it declined every control the pinned toolchain
      provides for exactly that (no reach:, no @reaches, no fixture-paths, no
      entrypoint-paths) while the demo seed fabricates the whole predicate and both
      ends of the loop. Declining the countermeasure in the change premised on
      needing it is not a deferral, it is the same mistake. Registry gains
      fixture-paths and entrypoint-paths; the producer carries reach: required.
      (4) The RATE gains headroom. At N=12 the stated N/4-per-rolling-7-days equals
      the calendar's own N/28-per-day drain, so occupancy converged to ~10 of 12 and
      could never recover from a missed run — measured over 365 simulated days. The
      bound must exceed the drain. Recorded as an interim measure: the per-org
      metering dial stays deferred (Q-18).
      WHAT THIS DOES NOT CHANGE: three items on first contact (DEC-47); the
      four-week calendar shape (GEN-1 v4); the deferred metering dial (Q-18); and
      every guardrail — the producer still routes through GENS-7/PIPE-2.
  DEC-47:
    v: 1
    date: 2026-07-28
    by: founder (shpin.p@diffco.us)
    binds: [DEC-46, GENS-8, GEN-1, ONB-6, Q-18]
    title: Split the trigger element in two, and state the first batch's size as a number
    statement: >-
      TWO CALLS, both made after a scope review that Cortex v0.25 mandated
      (three consecutive fails and no pass on gen-content-generation, plus an
      element-size report naming GENS-8 at 11531 chars against a 2000 threshold).
      THE SCOPE REVIEW'S FINDING. DEC-46 split this delta once already — trigger
      shipped, metering deferred — and it worked: five of eight findings from the
      preceding round disappeared with the deferred region. The next round then
      failed on three new highs, and all three are the SAME SHAPE one level down:
      a rule stated once that the two producers need different versions of. "The
      first batch lost its size" (the surviving per-run cap named only the
      refill); "a date that carries no item is not a bound" (the refill's
      convergence rule); "the bounded re-arm did not bind" (the first batch's
      terminal state). Eleven acceptance clauses cluster the same way — five test
      only the first batch, two only the refill, the rest shared setup. And the
      two answer to DIFFERENT requirements: the once-only batch is ONB-6's "first
      proof, lazily", the standing refill is GEN-1's rolling calendar. That is
      not one behaviour with edge cases.
      DECISION 1: SPLIT. GENS-8 v2 keeps the ONCE-ONLY first batch (observer,
      level trigger, atomic conditional claim, bounded re-arm, at-bound claim
      retention, calibration framing). A NEW SECOND ELEMENT owns the STANDING refill (daily
      sweeper fan-out, occupancy-to-N at latest unfilled dates, per-date
      idempotency, the rolling-7-day rate, org-scoped handle). The two failure
      modes are opposite — the trigger must never double-fire, the refill must
      never flood — which is why each bound is now stated on the producer it
      binds. The shared premise ("generation runs without a session; a button
      would not have closed INC-12") stays on GENS-8, whose acceptance (a) is the
      clause that tests it; the refill element's daily-sweeper nature carries it inherently.
      DECISION 2: THE FIRST BATCH IS THREE ITEMS, STATED AS A NUMBER ON THE
      ELEMENT. The value is not new — Q-18 already records "a per-run cap of
      three items for both autonomous producers" — but GENS-8 INHERITED it by
      reference ("the same per-run cap the refill takes"), and an inherited bound
      is exactly what the round-6 high was: the ceiling that used to bound both
      producers was excised and only one restatement survived. A number on each
      element cannot be excised by editing the other. The count itself was
      re-affirmed on founder-facing grounds: three shows range — a mission post,
      a programme post, a person — while staying small enough to read and
      redirect in one sitting, and the calibration framing's own logic caps it,
      since a correction on card one cannot improve siblings already written.
      Five was weighed and rejected as the overwhelm the Phase F audit kept
      finding; two as too thin to read as delivered work.
      WHAT THIS DOES NOT DO: the deferred metering dial stays deferred (Q-18,
      DEC-46) — this decision states a per-run count, not the per-org ceiling.
      GEN-1 and ONB-6 are unchanged: this is a spec-element split inside their
      approved scope, recorded as a DEC because the count is a product call and
      because the split re-homes an element that other approved specs cite.
  DEC-46:
    v: 1
    date: 2026-07-26
    by: founder (shpin.p@diffco.us)
    binds: [DEC-44, DEC-45, GENS-8, TOP-1, TOPS-1, INC-11, INC-12]
    title: Split the job-runner delta — ship the unattended trigger, defer the metering
    statement: >-
      CORRECTION FIRST, because the previous decision rested on a claim that was
      wrong. DEC-45 was recommended as needing "no cascade". It does: STWS-1 is an
      APPROVED P0 spec whose sole acceptance reads "every org's rolling 4-week
      plan carries >=1 impact/gratitude" with the designation living "on the
      planned slot" — the artifact DEC-45 deletes — and GEN-1's title and
      statement, the GENS register's intent and interfaces, XG-4, XG-8 and G-4's
      coverage note all still assert the four-week forward plan. Bumping GEN-1
      cascades 75 citing sites, 3 stale pins and five coverage assertions
      including STW-1. The founder chose DEC-45 on an understated cost.
      THE EVIDENCE THAT PROMPTED THIS SPLIT. Five challenger rounds on one delta,
      all FAIL. The TRIGGER half (ARC-28's port, the transactional conditional
      claim, the scheduledFor discriminator, the single daily sweeper) was fixed
      in r1 and has been re-verified as holding in every round since. EVERY high
      in rounds 2-5 has been the METERING half — the ceiling, the horizon, the
      cadence — because bounding what Steward writes is entangled with GEN-1's
      planning model, STW-1's quota artifact and XG-8's calendar, three approved
      contracts this delta does not own. A round-6 attempt at the same shape would
      be the sixth.
      DECISION: split the delta. SHIP the unattended trigger — GENS-8 reduces to
      the first-batch observer plus the rolling refill, which is what closes
      INC-11 (no heartbeat) and INC-12 (nothing calls the chain) and is the whole
      of what makes Steward write unprompted. DEFER the metering to its own change
      with its own cascade budget and its own DEC, RETAINED AS Q-18 so the
      deferral stays visible and re-raisable (SDLC Phase C) rather than living
      only in this statement; until then both autonomous producers carry a simple
      per-run cap rather than a governed per-org dial. DEC-44 (3) and
      DEC-45 are both SUPERSEDED as to the horizon question, which is reopened and
      unanswered rather than quietly settled.
      IN SCOPE FOR THE TRIGGER, because round 5 found it missing: TOP-1's
      scheduled agenda run has no invoker anywhere, so a fresh org's once-only
      first batch would find an empty agenda, persist zero drafts, and SUCCEED —
      consuming its claim and reproducing INC-12 one link upstream, in the very
      element written to close it. The agenda run joins ARC-28's consumers and
      becomes a named precondition of both triggers.
      WHAT THE DEFERRAL COSTS, stated plainly: without a governed ceiling the
      Ready stack has no per-org bound, so the finite-and-finishable promise
      (UX-3, G-3) rests on the per-run cap and the natural cadence until the
      metering change lands. That is a real gap, it is recorded here rather than
      papered over, and it is smaller than shipping nothing — today the founder
      receives no drafts at all.

  DEC-45:
    v: 1
    date: 2026-07-26
    by: founder (shpin.p@diffco.us)
    binds: [DEC-44, GEN-1, GENS-1, GENS-8, XG-8]
    title: Drop the plan/draft split — the ceiling bounds the horizon itself (refines DEC-44 (3))
    statement: >-
      DEC-44 (3) directed "plan a month, surface a few": keep a rolling four-week
      calendar of PLANNED slots while Ready holds only a few drafted cards. Round 4
      of the job-runner challenge found it unbuildable as specified — it requires a
      durable UN-DRAFTED plan slot, and no carrier exists. architecture/data-model.yaml
      models no plan entity, DM-5's editorial lifecycle has no pre-draft state, and
      the calendar exists only as content_item.scheduled_for. Both workarounds are
      closed: persisting slots as ContentItems puts them inside the very
      disposable-draft count that gates generation, so a four-week plan saturates
      the ceiling and generation never runs at all; recomputing the plan on read is
      non-deterministic (planCalendar pairs type-to-subject through an LLM Skill),
      voids the no-duplicate-slot acceptance, and blinds GENS-1's quota seeding —
      recentDesignations reads designations off content_item, so un-drafted slots
      are invisible and the STW-1 impact/gratitude rhythm silently degrades.
      DECISION: plan and draft stay COUPLED. The ceiling bounds the HORIZON itself
      — Steward plans and drafts only the few items it surfaces, and extends as
      they clear. Chosen over adding a plan-slot DM-* entity (a migration plus
      cascades to GENS-1's acceptance and XG-8's "every calendar entry carries a
      title snippet and a type chip", which an un-drafted slot cannot supply) and
      over deferring the horizon entirely.
      WHAT THIS COSTS, stated honestly: "Coming up" in Plan & Published (XG-8)
      shows the near horizon rather than a full month, so the glass wall is less
      forward-looking than DEC-44 (3) imagined. That is the price of not inventing
      an entity to satisfy a clause, and it is reversible — the plan-slot entity
      remains the upgrade path if cohort-1 founders want to see further ahead.
      WHY IT IS RECORDED RATHER THAN QUIETLY REVISED: DEC-44 (3) was a founder
      call, and the SDLC does not let an agent overturn one because it turned out
      to be inconvenient to build. The challenge found a real infeasibility, the
      escalation went up, and this is the recorded answer.

  DEC-44:
    v: 1
    date: 2026-07-26
    by: founder (shpin.p@diffco.us)
    binds: [G-5, ARC-3, PRO-4, ONB-6, ONBS-6, GEN-1, GENS-1, INC-11, INC-12]
    title: Phase F repair decisions — Steward gets a heartbeat; day-one success is an approved draft
    statement: >-
      Four founder calls taken on the Phase F founder-truth audit, which found
      that the built product cannot produce content unaided (INC-12) and has no
      way to act between visits (INC-11). Evidence:
      design/walkthroughs/audit-2026-07-26/.
      (1) THE HEARTBEAT — ADR-0003's Job/Queue port (cron + work queues, pg-boss
      on the existing Postgres) is IMPLEMENTED, not deferred. Steward drafts,
      discovers and checks in on a schedule with no session open. Chosen over
      session-triggered generation because a button that makes Steward work is
      still a tool the founder operates — the failure mode vision.md says this
      persona abandons after two attempts — so the button is not a smaller
      version of the right fix, it is a different product. This resolves INC-11,
      unblocks PRO-4 (DEC-24's interruption budget, currently unbuildable), and
      is the flexibility-limiting call SDLC A5 requires be recorded.
      (2) DAY-ONE SUCCESS IS AN APPROVED DRAFT — G-5's "live" is honestly
      re-scoped for the pre-OAuth phase: the first session succeeds when the
      founder APPROVES something Steward wrote. Publishing stays dev-stubbed;
      Meta/X app review is not on the critical path. G-5's enduring 48h
      live-post target is retained, with an explicit interim measure (G-5 v2) so
      the commercial commitment is not quietly weakened — only its measurable
      bar for this phase is.
      (3) PLAN A MONTH, SURFACE A FEW — planAndDraftCalendar generates the
      rolling four-week calendar so Plan & Published is genuinely
      forward-looking, but Ready only ever holds a few cards at a time. This
      reconciles DEC-18's stated cadence ceiling (~1 item/day, a few posts a
      week) with the planner as built, keeps the spine finite and finishable
      inside G-3's fifteen minutes, and gives STW-1's impact/gratitude spacing a
      real window to operate over. The metering between calendar and Ready is
      new behaviour and needs a GENS spec element.
      (4) THE FIRST BATCH IS AUTOMATIC, FRAMED AS CALIBRATION — generation fires
      on the ONBS-6 minimum-viable-context predicate with no gate and nothing to
      click, but the first drafts are presented as a first attempt ("here's my
      first go, tell me what's off") rather than as finished work. Chosen over a
      confirm-the-profile gate (which XO-1 forbids) and over an unframed batch:
      it sets honest expectations at the moment Steward knows least, and turns
      an early rejection into a MEM-1 correction that improves the next batch
      instead of a disappointment. ONBS-6 specifies the trigger, not the
      framing — the framing needs a spec element.

  DEC-43:
    v: 1
    date: 2026-07-25
    by: founder (shpin.p@diffco.us)
    binds: [ADR-0010, EVAL-4, G-2, G-5]
    title: Found the stories register (US-*) and an automated e2e tier — activating the dormant @validates channel
    statement: >-
      Authorizes a new REGISTER KIND and ID prefix, which is a structural
      governance addition the agent may not make autonomously. Founder decision
      taken at the start of the founder-UI build, alongside DEC-42.
      WHY NOW. The marker vocabulary has three channels (method/testing.md):
      `@implements` (code realizes a spec-element), `@verifies` (a unit or
      integration test verifies it), and `@validates` — which cites a STORY and
      is what lets a requirement roll up to `satisfied`. The first two have been
      in use since the backend phase; the third has been DORMANT since ADR-0010
      because this project has no stories register, so `@validates` had no legal
      target and every user-visible flow was verified only at the unit tier. The
      UI phase is exactly where that gap bites: focus restore, per-region
      inertness, "the kill switch is reachable under a phone takeover" and "the
      pinned zone still announces" are RENDERED-STATE facts no unit test can see
      — they were caught this phase only by ad-hoc agent browser checks, which
      leave no regression behind. EVAL-4 already requires the @validates channel
      turned on; this supplies the register it needs.
      WHAT IS AUTHORIZED. (1) A `stories` register at `.spec/stories/`, prefix
      `US`, whose items carry a persona and a testable acceptance and serve a
      requirement (the engine's story floor, enforced by docs-check).
      (2) `@playwright/test` as an
      automated e2e tier with a CI step, running hermetically on the dev-stub LLM
      so it is deterministic and never keyed — the DEC-41 tiering, extended to
      the browser. (3) e2e specs under `client/e2e/` carrying `@validates US-*`.
      THE DELIBERATE SHAPE. The stories register IS the normative form of the
      manual-evaluation walkthrough: each story is one thing the founder will do
      by hand at the end of this phase, its `acceptance` is what they should
      observe, and its e2e spec is the machine-checkable half of the same
      sentence. MANUAL-EVAL.md is then a RENDERING of the register, not a second
      list that can drift from it. This is why the register is founded here
      rather than bolted on at the end: the walkthrough should accumulate as the
      UI is built, not be reconstructed from memory afterwards.
      HONEST COST. It adds a register kind, a prefix, and build time per
      increment; it regresses nothing. The over-structure lens applies (VAL-6:
      does the ID earn its keep) — each US-* must be referenced by at least one
      e2e spec, or it is prose pretending to be governance.

  DEC-42:
    v: 1
    date: 2026-07-25
    by: founder (shpin.p@diffco.us)
    binds: [ADR-0002, ADR-0011, ARC-2, GR-7, DS-1, XH-12]
    title: Founder/public surfaces decline ShadCN — native platform primitives + the DSS inventory; internal tools keep their shadcn allowance
    statement: >-
      Taken at the start of the founder-UI build, on an Architect-Challenger FAIL
      of the proposed ADR-0011 that surfaced two coupled contradictions the agent
      could not resolve autonomously. TWO DECISIONS. (1) STACK — the constitution
      and ADR-0002 fix the client stack as "Tailwind + ShadCN", and ShadCN has
      never been installed. FOUNDER/PUBLIC-FACING surfaces (@client's founder UI,
      @news) DECLINE ShadCN: they compose the DSS-1..23 component inventory only,
      per the clause GR-7 v3 keeps binding there. This does NOT narrow DEC-35 —
      INTERNAL staff tools (ops/admin, OPS/ADM) keep their allowance to compose
      shadcn primitives directly, so the prohibition is scoped to SURFACES, not to
      packages or source roots. The challenger was right that GR-7 v3 + DEC-35
      scoped only the inventory-reuse clause and therefore could not by themselves
      authorize declining the library; this decision supplies that authorization,
      following the DEC-29 (Drizzle) / DEC-36 (@news) precedent of a founder call
      plus a dated ADR-0002 amendment, and cascades ARC-2 -> v2 plus every
      "Tailwind + ShadCN" citation site (constitution, overview intent, ARC-2 body,
      client/CLAUDE.md, client/src/index.ts). (2) SUMMONED-PANE MECHANISM — the
      challenger verified that @radix-ui/react-dialog cannot honor XH-12 v2: its
      modal mode calls hideOthers() (aria-hidden on everything outside the pane,
      up to body) which would make the DELIBERATELY-undimmed pinned zone —
      GR-3 holds, publish failures, channel re-auth, the cards that "cannot scroll
      away" — keyboard-unreachable, screen-reader-hidden, and pointer-inert, with
      its polite live-region updates swallowed; its non-modal mode has no focus
      trap, which DSS-4/DS-4 (P0, flexibility hard) requires. Rather than weaken
      the approved founder-decided contract, the CODE CONFORMS TO THE SPEC: the
      summoned pane uses native platform primitives — a NON-MODAL surface
      (dialog.show(), never showModal()) plus PER-REGION `inert` (the stream
      inerted, the pinned zone excluded and live) — the only mechanism that
      expresses XH-12's carve-out. (Mechanism corrected in the r2 challenge, which
      verified in headless Chromium that a TOP-LAYER modal dialog inerts the whole
      document, making `inert=false` on the pinned zone a no-op — showModal() is
      hideOthers() by another name. The substance of this decision — native
      primitives, no library, XH-12 v2 unchanged — is untouched; only the
      primitive's mode is named correctly.) XH-12 v2 therefore
      stands UNCHANGED (no v3, no weakening of the DEC-18 "holds pin and are never
      batch-cleared" invariant). Consequence accepted: the founder surfaces take on
      no new UI dependency (no ShadCN, no Radix), and the a11y machinery they
      hand-write — focus trap/restore, per-region inertness, roving-tabindex tabs —
      is held by the E5 e2e suite rather than by a library's reputation.

  DEC-41:
    v: 1
    date: 2026-07-23
    by: founder (shpin.p@diffco.us)
    binds: [ADR-0003, ADR-0008, ADR-0009, ADR-0010, PIPE-1, G-2]
    title: AI subsystem architected as an evaluated agent runtime — foundational AI phase before GEN
    statement: >-
      The AI subsystem — the product's core — must be deliberately architected for
      reliability, observability, and TESTABILITY before more of it is built on the
      go. Today it is a principle (PIPE-1 "one brain, several skills") plus
      per-capability prose: prompts, tools, model-routing, an agent runtime, evals,
      LLM observability, LLM reliability, and cost tracking are unspecified or
      placeholder, and none are built. Four founder decisions (2026-07-23) shape it:
      (1) AGENT RUNTIME WEIGHT = a FULL agent framework (a bounded multi-step
      tool-calling runtime), not the thin declarative layer. This deliberately
      REVISITS ADR-0003's "reject a heavy orchestration layer up front" clause with
      new information (the AI is the core and needs first-class runtime governance);
      ADR-0009 amends THAT CLAUSE ONLY — the rest of ADR-0003 (ports & adapters,
      self-contained dev, the job/queue seam) stands, so ADR-0009 does not supersede
      ADR-0003 and triggers no citing-spec cascade. Consequence accepted: a
      multi-step agent is harder to regression-test (trajectories, compounding
      non-determinism, cost), so the runtime is BOUNDED by construction (per-skill
      allowed-tools / max-steps / cost-budget / termination) and the eval framework
      scores trajectories, not only final output.
      (2) EVAL HARNESS = a bespoke in-repo runner (datasets as versioned artifacts +
      a scorer), no external eval SaaS — honoring ADR-0003 self-contained dev.
      (3) SEQUENCING = a FOUNDATIONAL AI PHASE lands before the first heavy
      generation vertical (GEN), mirroring the DEC-37 foundation-first move, so GEN
      and every later skill are built on the runtime and evaluated from day one.
      (4) REGRESSION GATE = TIERED — keyless deterministic + dev-stub tests on every
      commit (CI stays self-contained); the full keyed LLM eval runs on any harness
      artifact change (prompt / tool / model) and on demand, as a champion-vs-
      challenger comparison that BLOCKS a change that regresses the suite. This is
      the operational form of "updating the agentic harness must not degrade agent
      performance."
      AUTHORIZES: ADR-0009 (agent runtime & harness model, amending ADR-0003),
      ADR-0010 (AI evaluation & regression framework), and a new cross-cutting
      AI-evaluation requirement register scoped as VERIFICATION/ASSURANCE
      (traceable to the DEC-3 governance lineage + the goals' outcome tier, NOT a
      product capability on the G-2 approval-rate path — it tests that we produce
      good drafts, it does not produce them) — each challenger-gated at its design
      gate before code. Cost bounds tie to the PIPE-1 <$25/org/mo COGS target.
  DEC-40:
    v: 1
    date: 2026-07-23
    by: founder (shpin.p@diffco.us)
    binds: [ADR-0008, ADR-0002, PIPE-1, DM-2]
    title: LLM & embedding model selection — Google Vertex AI (Gemini), embeddings at dim 1536
    statement: >-
      Resolves the model-selection choice ADR-0002 and llm-pipeline.yaml (PIPE-1)
      deliberately deferred "to the skeleton". Now that the skeleton (walking
      skeleton + ACCS) has landed and the brain spine (ARC-11 Memory / ARC-12
      Onboarding) is the first capability needing generation + embeddings, the
      founder selects GOOGLE VERTEX AI / GEMINI as the v1 provider behind the
      ADR-0003 LLM port: generation/extraction on gemini-2.5-flash (pro reserved
      for quality-critical slots), embeddings on gemini-embedding-001 pinned to 1536
      dimensions (the GA Gemini embedding model id; a 2026-07-24 keyed smoke found
      the originally-written "gemini-embedding-2" 404s — a factual id correction,
      not a change to the decision's substance: same model family, same 1536 dims).
      This binds the DM-2 MemoryEntry embedding column to vector(1536)
      — a one-way-door (changing dimension later means re-embedding every org's
      corpus), which is why it is a recorded decision. Wired via VERTEX_AI_KEY
      (+ project/location) in env; a deterministic keyless dev fallback keeps
      self-contained dev + CI runnable without a GCP account (ADR-0003). Provider
      is swappable by configuration through the port; the technical rationale and
      alternatives are in ADR-0008. Consolidates the Gemini engine already named
      for Radar grounding (IG-3).
  DEC-39:
    v: 1
    date: 2026-07-22
    by: founder (shpin.p@diffco.us)
    binds: [DEC-29]
    title: Type architecture — Drizzle schema in @shared as the single entity source of truth
    statement: >-
      Refines the DEC-29 type split. That split put Drizzle tables in @backend and
      hand-written Zod ENTITY schemas in @shared — which duplicated each entity
      (the founder flagged `organization` defined twice: a backend Drizzle table AND
      a @shared Zod `Org`). DECISION: the Drizzle table is the ONE definition and it
      lives in @shared (including the BetterAuth-generated tables). Entity TYPES
      (`InferSelectModel`) and Zod validators are DERIVED from the tables (drizzle-zod)
      — a single source, exposed to the client through @shared, never re-declared.
      Client-facing shapes that must exclude server-only / secret fields (e.g. the
      ChannelConnection OAuth token, SEC-10) are DERIVED via `Omit` / select-schema
      `.omit()` — still single-sourced. @shared therefore takes a drizzle-orm +
      drizzle-zod dependency (pure schema definitions, no DB handle); the DB
      CONNECTION, queries, and migrations stay in @backend. Supersedes the earlier
      "@shared stays free of any heavy runtime dep" convention wording (conventions
      updated). Cross-package/tooling imports of the schema resolve via the
      @steward/shared package exports (works in every loader — tsx, drizzle-kit,
      the better-auth CLI) rather than only the @shared tsconfig alias.
  DEC-38:
    v: 1
    date: 2026-07-22
    by: founder (shpin.p@diffco.us)
    binds: [Q-16, ACC-3]
    title: Vertical build order — hybrid, accounts/identity (ACCS) first
    statement: >-
      Resolves Q-16 now that the DEC-37 foundation phase is complete (main@0660bb2).
      BUILD ORDER = HYBRID: build the unavoidable, security-critical substrate
      (real auth + server-side org confinement) FIRST, then feature capabilities as
      vertical slices that each pull the design-system primitives (DSS) they need —
      rather than building the entire design system or a whole vertical up front.
      FIRST CAPABILITY = ACCOUNTS/IDENTITY (ACCS): stand up real BetterAuth (Google
      sign-in + dev email-only login, SEC-7) REPLACING the walking-skeleton's
      dev-session cookie seam, the Org/User/Membership model (DM-1/15/16, ACC-1/2),
      and ACC-3 server-side active-org confinement enforced on every request. This is
      first because everything else needs a real authenticated, org-scoped context,
      and the skeleton's stubbed session is a known seam to close. DSS primitives are
      pulled as the first UI-bearing vertical needs them (not a big-bang DS build).
      Tenant confinement (ACC-3) is treated as foundational and lands with ACCS, not
      bolted on later.
  DEC-37:
    v: 1
    date: 2026-07-22
    by: founder (shpin.p@diffco.us)
    binds: [ADR-0002, ADR-0007, DEC-29, DEC-36, ARC-1, Q-16]
    title: Pre-code foundation phase — scaffold + type-gate + @shared type spine + AX machinery + walking skeleton land before any feature; vertical order deferred
    statement: >-
      Sequencing decision taken at the spec-complete / zero-code boundary (547 IDs,
      a 110-spec ready frontier, 0 dirty). NO feature spec on the frontier may be
      realized until a FOUNDATION PHASE lands first — recorded now so an agent does
      not pull a feature off the flat frontier into a bare tree. The foundation phase
      is FIVE deliverables, each REALIZING existing governance (no new behavior spec):
      (1) REPO SCAFFOLD — the four source roots (@client / @backend / @shared / @news,
      per DEC-36 / ADR-0002) with tsconfig path aliases, biome, Vite, Drizzle, and a
      dev `docker compose` bundling Postgres + pgvector (ADR-0007 dev env). (2) THE
      TYPE-HYGIENE GATE WIRED FIRST — strict `tsc` + biome + no-`any` in the pre-commit
      hook AND app CI (constitution "types/biome checked before commit"; the Stage-1 CI
      of .spec/CLAUDE.md) — BEFORE feature code, so a green gate is never retrofitted
      onto an already-dirty tree. (3) THE @shared TYPE SPINE as single source — Drizzle
      schema inferred from the data model (DM-*), Zod entity schemas, branded IDs
      (DEC-29 conventions) — so verticals IMPORT shapes and never reinvent them.
      (4) AX MACHINERY turned on at scaffold time — a CLAUDE.md per source folder
      (constitution) + the cortex-managed folder-context blocks (the plugin's
      read-time context injection) + PATH-SCOPED conventions
      authored via /cortex:conventions (the conventions register itself defers the
      client/backend/shared blocks "until src/ exists"). (5) A WALKING SKELETON — one
      thin end-to-end slice (dev-login → app shell → a tRPC call → a Postgres + pgvector
      round-trip → one WebSocket push → an OTel span) proving the whole stack composes
      before fan-out. RATIONALE: at this boundary the cheap-now / expensive-to-retrofit
      items are the gate, the shared type spine, the per-folder AX context, and proof
      the stack integrates. The design gate already swept the pre-code open questions:
      Q-14 is resolved (DEC-35), Q-15 is explicitly not a phase-1 blocker, and the rest
      (Q-1..Q-7, Q-9, Q-13) are GTM / metric-driven and resolve from cohort-1 data — so
      no question needed forcing here, and "governance-first" collapsed to this decision
      alone. DEFERRED: the vertical BUILD ORDER (which capability first, and layer-first
      vs vertical-slice) is left open as Q-16, decidable once the substrate exists —
      foundation-first does not by itself pick the first feature.
  DEC-36:
    v: 1
    date: 2026-07-22
    by: founder (shpin.p@diffco.us)
    binds: [CON-3, ADR-0002, ADR-0004, ADR-0007, SEC-11]
    title: Deployment topology & environments — Docker Compose now, managed later, Cloudflare CDN
    statement: >-
      Resolves CON-3 (the deployment gap), concretizing the ADR-0003 shapes. DEV
      stays self-contained/zero-cloud. PHASE-1 PROD (cohort 1): self-hosted
      SINGLE INSTANCE via `docker compose` — a bundle of the app (backend + SPA),
      the news renderer, and BUNDLED Postgres. PHASE-2 PROD (later, when scaling
      is actually needed): horizontally-scalable managed — GCP Cloud Run +
      Cloud SQL OR DigitalOcean (provider left OPEN, decidable later — not a
      phase-1 blocker; ports & adapters keeps domain code provider-agnostic).
      CLOUDFLARE CDN fronts static prod assets AND the public news surface (edge
      cache + tag-based purge = ADR-0004's immediate-takedown mechanism, now
      concrete); Cloudflare R2 stays the blob adapter (already ADR-0003). NEWS
      RENDERER becomes a 4th top-level source package `@news` (the ADR-0004 Astro
      + React-islands SSR deployable, ARC-23) — amends the constitution's "three
      src folders" to four (client/backend/shared/news) and ADR-0002's source
      layout. ENVIRONMENTS: `development` (dev-login enabled, SEC-7) and
      `production`; the internal ops/admin console is enabled by a config FLAG,
      not a separate cluster (satisfies SEC-11 "disabled outside the ops
      environment" simply for phase-1) — recorded as SEC-11 v4 with the accepted
      single-instance isolation reduction. PHASE-1 DATA DURABILITY is an obligation
      NOW (confidential org data in the bundled Postgres, SEC-4): scheduled
      `pg_dump` → Cloudflare R2 + a restore path (minimal, no extra infra); only
      residency + uptime-SLO defer to the phase-2 provider (Q-15). The Cloudflare
      Cache-Tags purge is a fallible outbound API call (IG-11), so the SEC-8
      immediate-takedown obligation is enforced in PUBS-1/NWSS-1 acceptance (purge
      failure fails the takedown loudly). Recorded in a new deployment-topology
      ADR building on ADR-0003; ADR-0004 amended for the concrete Cloudflare CDN.
      (Backup posture + the SEC-11/SEC-8 enforcement cascades were added
      post-challenger — deployment-2026-07-22-r1.md — in the same change.)
  DEC-35:
    v: 1
    date: 2026-07-21
    by: founder (shpin.p@diffco.us)
    binds: [GR-7, ADMS-1, Q-14, ADM-1]
    title: Admin-capability finalization — console DS, staff roles, time-box & retention
    statement: >-
      Pre-implementation finalization calls for the admin/platform-management
      capability (founder). (1) CONSOLE DS: the internal admin console is built
      on shadcn primitives styled with the steward theme tokens (DS-1 tokens,
      DS-3 type, DS-4 a11y), NOT the founder DSS component-contract inventory —
      GR-7's "reuse the design-system inventory" clause is SCOPED to
      founder/public-facing surfaces (the brand product); internal staff tools
      must resolve visual values from the steward tokens but may compose shadcn
      directly. GR-7 → v3. This RESOLVES Q-14 (no DS-trio extension for internal
      tools; the console is deliberately lower-fidelity, XOPS/DEC-8 precedent).
      (2) STAFF ROLES: two platform-staff roles — admin (full, incl. creating
      staff users + assigning roles) and support (ALL org operations —
      impersonation, lifecycle, billing oversight, ledger, KPIs — EXCEPT
      staff-user management). A seeded admin user at install (default
      credentials, rotated manually); admins create staff and assign admin|
      support (BetterAuth admin plugin). ADMS-1 → v2. (3) OPERATIONS: support-
      impersonation time-box = BetterAuth default (1h); activity-ledger +
      SupportSession audit retention = UNLIMITED for now, revisitable (CON-4),
      with the BIL-2 hard-delete-vs-audit-trail interaction to settle at
      implementation. The DEC-33 support marker stays a plain neutral label
      (kept simple), its founder-surface rendering the tracked ADMS-2 cascade;
      ACC-4 multi-seat stays P2; a security/threat-model pass on impersonation
      AND staff role/privilege management (incl. the role-change escalation audit
      trail) is the pre-ship gate (SEC threat-model deferral).
  DEC-34:
    v: 1
    date: 2026-07-21
    by: founder (shpin.p@diffco.us)
    binds: [XADM-1, XB-4, Q-14]
    title: Admin-capability experience — internal console (XADM) + founder team surface
    statement: >-
      Founder-directed authoring of the admin/platform-management experience
      (the /cortex:ux round completing the capability's Steps 1-5). Founds the
      internal platform-admin console register XADM (experience/admin.yaml) — four
      journeys serving ADM-1..6: administer/lifecycle (XADM-1), support
      impersonation act-as-org with a reason-gated entry + persistent banner +
      time-box (XADM-6), the org activity-ledger audit (XADM-10), and billing +
      KPI health (XADM-13) — internal-only, lower-fidelity than the founder spine
      (the XOPS/DEC-8 precedent), governed by SEC-11 v4 / ADR-0006. Adds the
      founder-facing multi-seat team surface (XB-4/5/6, serving ACC-4, P2) in the
      Controls area, on the founder-spine card system. Passed the Product-Designer
      challenger (r1 fail → r2 pass; record
      specs/challenges/experience-admin-2026-07-21-r2.md). The internal console
      needs DS primitives the founder-spine design system does not own (dense
      table, data-viz, the act-as banner trust-chrome) — tracked as Q-14, to be
      resolved before the screens are built. The DEC-33 founder-facing support
      marker is deliberately NOT in the internal console (staff see full
      attribution); its founder-surface rendering remains the tracked ADMS-2
      cascade.
  DEC-33:
    v: 1
    date: 2026-07-21
    by: founder (shpin.p@diffco.us)
    binds: [VAL-3, ADM-2, SEC-11]
    title: Impersonation carve-out surfaces a neutral fact-of-support marker (refines DEC-31)
    statement: >-
      Refines the DEC-31 VAL-3 carve-out after the ADMS design-gate surfaced a
      failure mode: at an ask-first (TL0) org, a fully-silent staff act-as
      publish appears as a post the founder never approved, reading as a breach
      rather than a benign result. Founder decision (2026-07-21, admin-capability
      ideation): a staff act-as action surfaces a NEUTRAL "a Steward support
      action" MARKER on the founder's own surfaces (e.g. the PUBS-3 publish log)
      alongside the result — the FACT of support is shown, the staff IDENTITY is
      withheld. This turns ON the founder-visibility DEC-31 had deferred to a
      "later switch", so it is recorded as its own decision and VAL-3 goes to v3
      (identity hidden; fact-of-support shown). More honest to VAL-3's
      nothing-hidden spirit than full silence; the staff-facing activity ledger
      (DM-17, ADMS-3) retains full attribution for audit.
  DEC-32:
    v: 1
    date: 2026-07-21
    by: founder (shpin.p@diffco.us)
    binds: [DM-1, SEC-4, SEC-7, SEC-11, ADR-0005, OPS-1, G-1]
    title: Adopt an Org⟂User identity, staff-impersonation, and org activity-ledger model
    statement: >-
      To operate and support the platform (extending the internal ops console
      OPS-1), the founder adopts three foundational additions, decided now
      because there is no src/ yet — the account/auth shape is a one-way door
      best fixed before code. (1) SEPARATE IDENTITY FROM TENANT: the Org (DM-1,
      today the aggregate root and implicit account) is split from a new User
      (auth principal, SEC-7); users link to orgs via a membership with a role.
      (2) SUPPORT IMPERSONATION ("act as org"): a dedicated platform-staff role
      may enter any org through a session-scoped org context and act AS the
      founder; regular users are hard-confined to their own memberships. This
      extends the SEC-11 operator posture (reason-gated, fully audited,
      environment-gated) from read-mostly QA to act-as, and supersedes/extends
      the ADR-0005 operator-access model — the concrete model (time-box,
      reason-gate, act-as write boundary, audit retention) is authored as a
      superseding ADR in the architecture pass. (3) ORG ACTIVITY LEDGER: an
      append-only per-org record of all actions — user, system/automatic, and
      background jobs (incl. External Radar discovery) — reviewable by staff;
      it generalizes the PIPE-1 model-call logging. New entities (User,
      membership, activity event, support-session) and the auth generalization
      are defined in the data-model/architecture pass. Serves G-1 (operate and
      retain cohort-1 orgs). Depends on the compass changes DEC-30 (multi-seat)
      and DEC-31 (VAL-3 carve-out).
  DEC-31:
    v: 1
    date: 2026-07-21
    by: founder (shpin.p@diffco.us)
    binds: [VAL-3, SEC-11]
    title: VAL-3 carve-out — internal support impersonation is audited, not founder-surfaced
    statement: >-
      VAL-3 ("Nothing hidden — everything auto-done is logged AND visible")
      is the product's core trust promise about the SYSTEM's autonomy. The
      founder decided that internal support staff acting-as-org (DEC-32) is a
      single, deliberate EXCEPTION to the "visible" clause: every staff
      impersonation action is logged IN FULL internally (reason-gated,
      attributed, audited — SEC-11) but is NOT surfaced to the founder.
      Resolves INC-5. Scope of the exception is deliberately NARROW: it covers
      the ATTRIBUTION of a staff act-as action, not the RESULT — a founder still
      sees the material effects in their own surfaces (e.g. a published post
      appears). VAL-3 → v2 carries this carve-out inline so the value is
      self-documenting. Residual trust risk acknowledged (a silent act-as on
      confidential nonprofit data inverts the "nothing hidden" promise if it
      ever leaks); mitigation — keep act-as writes tightly scoped (the boundary
      is fixed at spec time) and design the ledger so founder-visibility can be
      switched on later without a schema change.
  DEC-30:
    v: 1
    date: 2026-07-21
    by: founder (shpin.p@diffco.us)
    binds: [SEC-7]
    title: Reverse the multi-seat non-goal — allow multiple org members
    statement: >-
      The founder reverses two governing statements to allow MULTIPLE members
      per org: scope.md's "Not in this product … multi-seat roles" non-goal and
      the users.md "Single account per org" persona line. Resolves INC-4. Going
      forward an Org has one or more member Users with roles (owner + members);
      the Founder-Operator persona generalizes to "org members", with the owner
      the default primary. This is the founder-facing half of the identity model
      (DEC-32); the internal platform-staff role is distinct and not an org
      member. scope.md and users.md are amended in this change. Note (sequencing,
      not scope): the two-founder / 12-week / R-8 constraint argues for building
      the internal-admin core first and the founder-facing multi-seat management
      UX as a thin follow — recorded so the requirement authoring can phase it.
  DEC-29:
    v: 1
    date: 2026-07-20
    by: founder (shpin.p@diffco.us)
    binds: [ADR-0002]
    title: Engineering conventions register + Drizzle; Vercel Eve rejected, keep Vercel AI SDK 7
    statement: >-
      The founder expanded the constitution's Code Standards (root CLAUDE.md,
      2026-07-20) with prescriptive type-hygiene rules and two stack touches;
      this DEC propagates them into .spec at the right altitudes. Three parts.
      (1) FOUND the engineering CONVENTIONS register (.spec/conventions.yaml,
      kind: conventions — the implementation compass, scoped prose, DEC-28
      mechanism): strict typing (no `any`), strictly branded types for IDs,
      reuse field shapes via Pick/Omit/Union rather than redefining, prefer
      type inference from Drizzle over hand-written row types, Zod
      type-definitions-with-inference for key entities, and no unsafe
      json/yaml parsing (Zod-validate at every untrusted boundary). These are
      idiom-level "how we build here", not requirements — surfaced to the agent
      at edit time, never a roll-up node. (2) ADOPT Drizzle as the light,
      type-first query builder over Postgres + pgvector — recorded as a dated
      amendment to ADR-0002 (it fills the ORM slot ADR-0002 left open; it is
      consistent with the "one language, minimal surface, strong typing" axis
      and is explicitly NOT the "Prisma-style heavy ORM" that ADR-0002's
      options-considered rejected). (3) REJECT adopting Vercel Eve as the
      primary AI-agent framework (a mid-session constitution edit, reverted):
      the LLM layer stays the proven, provider-abstracted Vercel AI SDK 7 per
      ADR-0002 — Eve is a very new framework and making it primary would be a
      one-way-door lock-in on the product's core (VIS-1) against ADR-0002's
      12-week/minimal-moving-parts founding axis; recorded as a dead-end
      (LRN-25) so it is not silently re-raised without new maturity evidence.
  DEC-28:
    v: 1
    date: 2026-07-20
    by: founder (shpin.p@diffco.us)
    binds: [XO-1, XH-1, XA-1, XP-1, XG-1, XB-1, XN-1, XOPS-1]
    title: Split the monolithic experience spine into eight by-domain registers
    statement: >-
      The One-Home experience spine (DEC-18) had grown to a single ~1000-line
      register of 56 elements (EXP-*, experience/spine.yaml) — past the
      readability / write-contention threshold the Cortex method names as the
      trigger to split (method/ui.md "Scaling", shipped in cortex v0.21.0). The
      founder directed the split, sequenced Cortex-guidance-FIRST so the split
      would conform to a blessed convention (done: v0.21.0 added per-domain
      experience-register guidance, fixed the serves goal-vs-requirement doc
      drift, promoted `touchpoint` to a standard kind, and shipped the
      ux-designed completion tier). Decision: decompose the spine BY JOURNEY
      DOMAIN into eight registers, each with its own prefix and file —
      onboarding (XO), home / the One-Home shell (XH), autonomy (XA), proactive
      (XP), glass-wall (XG), account (XB), public (XN), ops (XOPS). The shared
      surface is homed ONCE and referenced by ID (VAL-4): the home shell (XH)
      is the most cross-referenced register; the glass-wall views, Controls
      tray, and satellites link to it, never copy it. This is a
      CONTENT-PRESERVING migration — every element body is verbatim from the
      DEC-18 spine; IDs were re-homed EXP-* -> <domain>-* in tree order, and
      the ~46 citing sites (17 gated specs' constrained-by, requirements,
      architecture, decisions, the vision-experience map) were re-pointed as a
      pure reference update, so no spec is re-challenged or version-bumped by
      this reorg. The eight registers are re-gated together by one
      Product-Designer challenger pass (structural/delta — content unchanged);
      experience/spine.yaml (EXP) is retired, experience/ui.yaml stays
      superseded for history. Chosen over keeping one register (fails the scale
      trigger) and over a register-per-journey (over-structure, VAL-6).

  DEC-23:
    v: 1
    date: 2026-07-19
    by: founder (shpin.p@diffco.us)
    binds: [TOP-1, TOP-2, TOP-3, TOP-4, DM-13, EXT-1, EXT-4, STR-1, GEN-1]
    title: Content Topics — a first-class proactive editorial-agenda + research-strategy capability (P0)
    statement: >-
      Founders of small nonprofits rarely have the time or the marketer's
      instinct to decide WHAT to talk about, or to define research criteria for
      finding external content that is genuinely interesting yet still relevant.
      Decision: the system owns the EDITORIAL AGENDA as a first-class capability
      (Content Topics, TOP). It proactively identifies content topics (TOP-1),
      holds a rich per-topic research strategy that drives external discovery
      (TOP-2), and gently/timely proposes topics with a reason (TOP-3); the
      active topic set is one shared, transparent, founder-editable source that
      structures internal content AND drives external research (TOP-4). P0,
      woven into the core loop: it reshapes EXT-1 (the Radar runs against the
      agenda + research strategies, not a static cause seed), EXT-4 (topic
      controls managed via the agenda), STR-1 (section (a) draws from the
      agenda), and GEN-1 (the planner pairs a taxonomy type with an agenda
      subject). New entity DM-13 Topic. Boundaries: engagement via real stories
      and honest framing only — within GR-1 (no outcome promises), VAL-1 (sell
      the process, not leads), VAL-4 (real over synthetic); cited sources
      (GR-5); external autonomy capped (EXT-3); proposals proactive-but-calm
      (VAL-6, R-10) and distinct from the strictly pull-only Discoveries feed
      (EXT-5). Aligns with VIS-2 (owns the context, moves first). Chosen over
      enriching EXT/STR in place (no single owner) and a research-strategy-only
      slice (which would leave proactive topic identification — the core of the
      idea — unbuilt).

  DEC-26:
    v: 1
    date: 2026-07-19
    by: founder (shpin.p@diffco.us)
    binds: [AUT-1]
    title: TL1 veto model is a founder-operator choice; default PUBLISH-THEN-TAKEDOWN (semantics pinned now; activation stays P2)
    statement: >-
      AUT-1's "TL1 auto-publish with 24h veto window" (DEC-13) is ambiguous
      between publish-then-takedown and hold-then-publish, and the safety-vs-speed
      trade is genuinely founder-specific. Decision: the TL1 veto model is a
      FOUNDER-OPERATOR-selectable setting, DEFAULTING to PUBLISH-THEN-TAKEDOWN.
      (a) DEFAULT publish-then-takedown — the approved design (XA-3 "Published —
      you can stop it until Thu 6pm", the DS-5 veto-window card, vision.md #8): a
      clean draft auto-publishes at its optimal time and the founder may PULL it
      within the 24h window (native platform delete for social; DM-5
      published->unpublished for news). This preserves the autonomy proof — it
      just gets done (VIS-2, G-4) — and requires NO spine/DS/vision change.
      (b) OPT-IN hold-then-publish — for a cautious founder: the draft is
      auto-approved but HELD in the DM-5 pending phase for 24h (veto = the
      approved->draft recall during pending), publishing only if unvetoed; nothing
      is public within the window. Either way the guardrail backstops (GR-3
      sensitive, GR-8 taboo) already HOLD dangerous drafts for the founder
      regardless of Trust Level, so publish-then-takedown never exposes a
      guardrail-violating post — only a "clean but the founder might have tweaked
      it" one, briefly. A veto/pull in EITHER model hands that item to founder
      control and it is NEVER re-auto-approved. Realized in the AUT behavior spec;
      TL1 ACTIVATION remains P2 (rides the AUT-2 promotion). Resolves the PUBS-1
      veto-window open-question; the opt-in hold-then-publish founder-facing card
      is a deferred P2 experience surface (the default veto-window card exists).
      Extends DEC-13. (Corrects this decision's initial hold-then-publish-only
      framing, which conflicted with the approved publish-then-takedown design.)

  DEC-24:
    v: 1
    date: 2026-07-19
    by: founder (shpin.p@diffco.us)
    binds: [PRO-1, PRO-2, PRO-3, PRO-4, INT-3, TOP-3]
    title: Shared proactive-interruption budget with priority tiers, owned by the Proactive Manager
    statement: >-
      The founder faces multiple INDEPENDENT proactive pushes — PRO-1 photo
      requests, PRO-2 campaigns, INT-3 interviewer curiosity, TOP-3 topic
      proposals — each self-rate-limited but with NO shared ceiling, so three or
      four per-capability limits can STACK into a spammy week (R-10, the exact
      risk the INT challenger flagged). Decision: a SINGLE per-org
      proactive-interruption BUDGET, owned and enforced by the Proactive Manager
      (PRO — new requirement PRO-4), that ALL proactive pushes draw from, with
      PRIORITY TIERS: HIGH (time-sensitive — a PRO-1 photo request tied to an
      imminent event, a PRO-2 campaign window) preempts LOW (deferrable — TOP-3
      topic proposals, INT-3 curiosity). When the budget is spent, low-priority
      pushes WAIT; a high-priority time-sensitive ask may still fire within a hard
      per-org ceiling. Serves G-3 (calm, <15 min/week), VAL-6 (moves first but
      calmly), R-10 (a technical/overwhelming action surface is a churn risk).
      Pull-only surfaces (the EXT-5 Discoveries feed) are NOT interruptions and are
      exempt. Chosen over per-capability limits only (they stack) and a single
      budget without tiers (low-value proposals could crowd out a time-sensitive
      photo request). PRO-4 owns the budget; INT-3/TOP-3/PRO-1/PRO-2 draw from it.

  DEC-25:
    v: 1
    date: 2026-07-19
    by: founder (shpin.p@diffco.us)
    binds: [NWS-4, TOP-4]
    title: News-site topic navigation reuses the editorial agenda (hybrid — universal categories + live TOP-4 agenda)
    statement: >-
      NWS-4 originally derived the org-domain browse topics INDEPENDENTLY from the
      cause profile in Memory — written before DEC-23 made the TOP-4 editorial agenda the
      single source of "what this org talks about", so the news site would grow a
      SECOND topic taxonomy that could diverge from the agenda. Decision: the news
      front-page topic navigation is HYBRID — the fixed UNIVERSAL categories (the
      GEN-1 content taxonomy: mission, founder, case studies, events, people,
      external) PLUS the org's ACTIVE TOP-4 agenda topics as the org-domain rail.
      Reuse the agenda (ONE source) rather than a second independent derivation —
      extends DEC-23's single-source discipline to the reader-facing surface. The
      universal categories give donors a STABLE browse structure; the agenda topics
      keep the org-domain rail CURRENT with what the org actually publishes. NWS-4
      -> v2. Chosen over keeping the separate reader-browse taxonomy (a second
      source diverging from the agenda) and over fully unifying (dropping the
      stable universal categories a public site wants). Extends DEC-23.

  DEC-27:
    v: 1
    date: 2026-07-20
    by: founder (shpin.p@diffco.us)
    binds: [SEC-11, OPS-1]
    title: Operator access is a dedicated, least-privilege, reason-gated + audited role (ADR-0005)
    statement: >-
      The ops console (OPS-1, OPSS-1/2) reads ALL orgs' confidential data (SEC-4)
      to run cohort-1 QA/failure/transcript/radar work — but no operator identity
      or authz existed (SEC-7 is founder BetterAuth only), a gap the OPS spec
      flagged as decidable before cohort-1 operators touch real org data. Decision:
      operator access is a DEDICATED role distinct from founder auth,
      least-privilege and scoped to the console functions; every access to an org's
      confidential data is REASON-GATED and fully AUDIT-LOGGED; the console is
      disabled outside the ops environment. Recorded as posture SEC-11; model +
      alternatives in ADR-0005 (accepted). Chosen over reusing BetterAuth with an
      operator flag (blurs founder/operator, weak cross-org audit) and
      aggregates-only access (defeats OPSS-1's draft QA). Surfaced by the OPS
      challenge; ratifiable — the specific mechanism can be adjusted before
      cohort-1 without reopening the posture.

  DEC-22:
    v: 1
    date: 2026-07-19
    by: founder (shpin.p@diffco.us)
    binds: [STR-4, CHT-2, APR-3, DM-3, PIPE-1, PIPE-2, GR-8, MEMS-3, MEMS-4]
    title: Memory is the single source of truth for founder rules/taboos; Strategy projects it; the overlay is enforced at the VAL stage
    statement: >-
      A founder rule like "never name donors" had two candidate homes in the
      specs: Strategy section (c) (STR-4, enforced via STR-3) and a Memory
      taboo overlay (MEMS-3); CHT-2 wrote such feedback to "Memory or Strategy".
      Decision: MEMORY is the single source of truth for founder-stated
      rules/taboos — it is the core asset every subsystem reads (MEM-1). The
      Strategy's org-rules section (c) becomes a rendered VIEW of the active
      Memory rule/taboo overlay, not a second store. Enforcement routes the
      active overlay to the pipeline validation (VAL) stage as a distinct
      deterministic gate CO-LOCATED with STR-3 (in PIPE-2) — not performed by
      STR-3. A correction therefore binds immediately, with no Strategy-sync
      step. Reconciles STR-4 (→v2), CHT-2 (→v2), and PIPE-1/PIPE-2 (→v2).
      Rejected: Strategy-as-enforcement-home (a correction would bind only
      after propagating into the Strategy — slower, and splits the core asset)
      and dual-store-with-precedence (least DRY; preserves CHT-2's ambiguity).
      Surfaced by the MEM spec's 3-lens challenger panel (2026-07-19,
      specs/challenges/mem-org-memory-*).

  DEC-21:
    v: 1
    date: 2026-07-19
    by: founder (shpin.p@diffco.us)
    binds: [GR-8, PIPE-2, MEMS-3]
    title: Founder-taboo enforcement backstop — an unconfident check forces human approval regardless of Trust Level
    statement: >-
      MEM-1 requires that a stated correction is NEVER violated in subsequent
      drafts — but detecting a semantic taboo (e.g. "never name donors") in
      generated prose is an LLM check with a residual false-negative rate. At
      Trust Level 0 the human approver catches misses; once the system
      auto-publishes (TL1/TL2) that check is the SOLE enforcement, so a miss is
      a published MEM-1 violation. Decision: a draft the guardrail chain cannot
      CONFIDENTLY clear against an active founder-stated taboo forces human
      approval regardless of Trust Level — a new guardrail GR-8, analogous to
      GR-3. Confident-clean drafts still auto-publish, so G-2 near-autonomy is
      preserved; only the ambiguous residual is held. Rejected: a blanket cap
      on all taboo-bearing content at TL1 (would gut autonomy, since most orgs
      state at least one taboo) and monitor-only (would weaken MEM-1's P0/hard
      "never" to "almost never"). Surfaced by the MEM spec's 3-lens challenger
      panel (2026-07-19).

  DEC-20:
    v: 1
    date: 2026-07-19
    by: founder (shpin.p@diffco.us)
    binds: [EXT-5, GEN-1, DM-8, XG-5, XG-8, XG-9, DEC-19]
    title: Design round-2 refinements — true breakpoints, informative calendar, Discoveries as a triage feed
    statement: >-
      Founder feedback on the first glass-wall/day-one renders, taken as four
      decisions. (1) TRUE BREAKPOINTS: mockups render at real phone width and real
      desktop width — nothing in between; on phone, single-action rows are wholly
      tappable with icon affordances (text micro-actions like "edit" collapse to
      icons; ≥44px targets, DS-4). Design-language rule, recorded in DESIGN.md.
      (2) Knowledge needs real visual hierarchy (design-level; no spec change).
      (3) CALENDAR IS INFORMATIVE AND INTERACTIVE (XG-8 v2): day cells carry
      content hints (title snippet + type + TIME), a day can hold several items
      (stacked chronologically — the ~1/day cadence is typical, not a cap;
      campaign/event days exceed it), mobile renders as an agenda list and desktop
      as the four-week grid; selecting any planned or published item opens its
      preview/interaction IN THE SAME SUMMONED PANE, one level deep with
      "back to Plan & Published" — confirming the founder's expectation that the
      right pane is where item interaction lives (DEC-19 summon-beside; the
      pane may swap its content one level, the stream never leaves).
      (4) DISCOVERIES IS A READ-FIRST TRIAGE FEED, not a passive reading room
      (EXT-5 v2, XG-5/XG-9 v2): each item leads with content worth reading
      (headline, source, short summary); after reading, three dispositions —
      "worth a post" (event-tied items flagged time-sensitive and prioritized),
      "save for later" (a kept pool the planner draws from to fill open calendar
      slots when no fresher material exists), "not for us" (teaches taste). The
      pull-only guard is UNCHANGED: never badged, counted, or nudged. Spine
      deltas re-challenged in the r2 round of this date.

  DEC-19:
    v: 1
    date: 2026-07-19
    by: founder (shpin.p@diffco.us)
    binds: [UX-1, XH-12, XH-13]
    title: Mobile-first priority + desktop summon-beside (simultaneity model)
    statement: >-
      Two decisions taken on review of the One-Home desktop rendering (AI-S-SC).
      (1) MOBILE-FIRST is a recorded priority, not an assumption: the phone is the
      FLOOR — every founder action is available one-handed in a phone browser; desktop
      adds capability in the form of SIMULTANEITY, never exclusive features (UX-1 v2).
      (2) DESKTOP SUMMON-BESIDE: on desktop a summoned surface (the opened draft, any
      glass-wall view, Controls) opens BESIDE the home — the stream stays present
      (dimmed, place kept, pinned zone never dimmed) while the elevated pane occupies
      the added width; on phone the same summon is a full-screen takeover. The stream
      itself never stretches into a dashboard: it stays a readable decision column, and
      width is spent on the pane (the "simultaneity, not density" contract). This
      REFINES the challenged r1 mechanics ("a summoned view is a mode of the home,
      never a sibling destination" — beside-with-stream-present strengthens exactly
      that guarantee); no new elements, serves edges, or states — recorded as a
      clarifying v2 of XH-12/XH-13 without a new challenge round (conscious call,
      altitude rule).

  DEC-18:
    v: 1
    date: 2026-07-19
    by: founder (shpin.p@diffco.us)
    binds: [XO-1, XH-12, UX-2, UX-3, UX-5, UX-7, UX-8, ARC-5, ARC-7, DEC-14, DEC-16, DEC-17]
    title: Full experience-spine replacement — the One-Home model (EXP register)
    statement: >-
      The founder directed a from-scratch reevaluation of the entire experience
      philosophy to break tunnel vision. Two independent first-principles drafts
      (conversation-first; one-adaptive-surface), authored blind to the existing spine,
      CONVERGED on rejecting the six-destination shell for one adaptive home — and the
      founder chose FULL REPLACE over selective migration. Decisions taken in the same
      round (all founder): (a) the home is a FUSED conversational stream — the Ready
      spine and the ambient leading conversation in one surface — justified by the
      stated cadence ceiling (~1 content item/day, a few posts a week), which removes
      the inbox-decay risk DEC-16 fled, and by the trust arc (dense and conversational
      early, sparse and report-like at earned autonomy); (b) four disciplines are
      structural, not stylistic: the stream always reaches an honest "caught up"; GR-3
      holds and failures are PINNED, never batch-cleared, never scroll away; the
      morphing home keeps ONE invariant skeleton (chrome and region order never
      change); trust-promotion offers proactively glimpse the glass wall; (c) the
      TRANSPARENCY GUARANTEE, at the founder's insistence: four plain-labeled,
      one-click, pull-only views — Knowledge, How I write, Plan & Published,
      Discoveries — permanently visible in the home chrome, never badged, never gated
      behind asking in chat (VAL-3); (d) supersession mechanics: the new register
      experience/spine.yaml owns EXP-*; the old experience/ui.yaml (UI-*) flips to
      superseded and is RETAINED on disk so every historical reference (DEC-8/9/14/16,
      INC-3, challenge records r1-r3) still resolves; nothing vetted is silently lost —
      the old spine's challenged edge cases are re-absorbed into the new structure
      (GR-3 hold semantics, veto/held non-confusability, article take-down, approve-
      undo/recall, thin-source onboarding floor, missed-week grace, cancel-with-dignity
      loss summary, bot states, citations/ArticleLink, channel re-auth honesty), and
      DEC-14's activity center DISSOLVES into the home's pinned needs-you zone + the
      Plan & Published log (its intent — VAL-3 logging + actionable alerts — preserved,
      its dedicated surface dropped); (e) UX-2/UX-3/UX-5/UX-7/UX-8 and ARC-5/ARC-7 are
      amended to the one-home model in the same change; the AI-S-DS design system and
      DEC-16 vocabulary carry over unchanged (every stream card resolves from the DS-5
      inventory). The register reaches approved after the Product-Designer challenger
      pass of this round.

  DEC-17:
    v: 1
    date: 2026-07-18
    by: founder (shpin.p@diffco.us)
    binds: [VAL-6, CHT-5, INT-4, R-10, APR-1, DEC-16]
    title: Interaction-model refinements — leading chat, learn-by-disposing enrichment, non-blocking onboarding
    statement: >-
      Founder refinements taken while resolving the alignment audit's coherence items —
      four decisions on HOW the founder interacts, all grounded in the persona
      (tech/marketing-averse, blank-page-averse). (2.1) The "two verbs" promise is the
      DISPOSITION-not-production essence; the concrete action set may exceed two verbs
      (Edit/Adjust, Skip) but each must stay minimal, plain-language, and
      consequence-clear — never technical; a technical/overwhelming surface is a churn
      risk (VAL-6 v2, R-10). This resolves the audit's "two-verbs" coherence item. (2.2)
      Chat must LEAD: it never shows a blank prompt — it drives the conversation so the
      founder mostly ANSWERS what they already know, offers non-trivial context-relevant
      suggested prompts when idle, and hosts the guided "Adjust" (what to change, with
      the most relevant options) as the alternative to APR-1's raw inline Edit (new
      CHT-5, P0). This resolves the audit's "chat-as-primary" coherence item — chat is
      the always-proactive conversational layer, not a blank surface the founder must
      drive. (2.3) "Zero-homework" onboarding means no BLOCKING homework: the system uses
      whatever it can find, structures it flexibly, and never blocks on gaps (ONB-1
      already), while a gentle, always-available set of OPEN QUESTIONS invites the founder
      to deepen the org's context in spare time (new INT-4, P1). This scopes the audit's
      zero-homework honesty item. Unifying concept: the ENRICHMENT LOOP ("learn by
      disposing") — every disposition that carries information (Skip/reject "why?", an
      Adjust) becomes a short optional conversation that deepens Org Memory (spans CHT-5,
      APR, INT-4; added to the glossary).

  DEC-16:
    v: 1
    date: 2026-07-18
    by: founder (shpin.p@diffco.us)
    binds: [APR-1, UX-3, UX-8, AUT-1, EXT-5, UI-6, UI-7, DEC-7]
    title: Terminology alignment — rename Inbox→Ready; de-jargon streak/trust-levels/radar
    statement: >-
      Founder-triggered vocabulary pass after the vision→experience audit found that
      several founder-facing terms carry mental models that fight the "colleague who
      brings finished work" vision (VIS-1, VAL-5, VAL-6). Decisions: (1) the core
      approval surface is renamed from "Inbox" to "Ready" (nav + home header "Ready for
      you") — "Inbox" evoked the email drudgery the persona bounced off (users.md) and
      the reactive/never-done model, the opposite of "the system moves first" and the
      finite-completion design; "Ready" names the state (finished work awaiting the one
      verb, Approve) and is cadence-agnostic. (2) "Streak" → "rhythm / steady presence"
      in founder-facing copy (it imported gamified guilt for a guilt-prone persona whose
      promise is "grace, never guilt"); the glossary concept "Stewardship rhythm" already
      used the better word; "streak" survives only as an internal metric name (G-4
      unchanged). (3) Trust levels shed the "TL0/TL1/TL2" codes in founder-facing labels
      → "Ask me first / Publish with a heads-up / Run on your own"; the codes stay
      internal (AUT-1 concept unchanged). (4) "Radar" → founder-facing "Discoveries"
      (surveillance metaphor → a calm reading room). SCOPE: this changes the canonical
      glossary vocabulary + current requirement/experience/design copy going forward;
      historical records (DEC-7/DEC-14, INC-3, challenge logs) keep their original wording
      as a log; internal file names and IDs are unchanged (e.g. apr-approval-inbox.yaml,
      the APR prefix). Two related coherence items from the same audit — squaring the
      vision text ("chat as primary" vs DEC-7's home-first-with-companion; "two verbs" vs
      four surfaced actions) and scoping the "zero-homework" onboarding promise for
      thin-source orgs — are proposed separately (they touch vision/requirement altitude).

  DEC-15:
    v: 1
    date: 2026-07-18
    by: founder (shpin.p@diffco.us)
    binds: [DS-3, DS-1, DEC-6, DEC-7, ADR-0001]
    title: Design foundations re-explored — substrate + terracotta reaffirmed, neutrals refined, type changed
    statement: >-
      The founder reopened the design foundations (choosing the deepest redesign
      option) and, after a fresh exploration — four theme directions rendered as an
      Artifact, then three real-font type pairings in Claude Design (project AI-S-PR) —
      REAFFIRMED the substrate (ADR-0001, the Airbnb open-design fork) and the
      terracotta accent, light-only, single-accent, and calm-colleague pillars
      (DEC-6/DEC-7). This is therefore a reaffirmation, NOT a supersession of ADR-0001
      or DEC-6/DEC-7. Two refinements are adopted, both realized in
      design/design-system/steward/tokens.css: (1) the neutral ramp is warmed to a
      deliberate bias toward the accent — page ground (#fbfaf8), ink ramp, and
      hairlines — so the neutrals read "chosen, not inherited", while card surfaces
      stay clean white for photo contrast (VAL-4); (2) typography moves OFF Inter (a
      generic default) to Bricolage Grotesque (display) + Source Sans 3 (body) — a
      characterful grotesk over a neutral humanist body — chosen over editorial-serif
      and single-humanist candidates, amending DEC-6's Inter choice and bumping DS-3 to
      v2. Downstream: the full component inventory and screens are rebuilt on this
      foundation and published to the AI-S-DS design system via /design-sync; ADR-0001
      gains a dated amendment note (substrate unchanged).

  DEC-14:
    v: 1
    date: 2026-07-18
    by: founder (shpin.p@diffco.us)
    binds: [INC-3, GR-3, DS-5, UI-6, UI-7, UI-16, UI-29, UI-45, UI-17, UI-67, UI-68]
    title: Pre-UI experience reconciliation — GR-3 manifestation, TL2 inbox, activity center
    statement: >-
      Resolves the founder-requested pre-UI reconciliation audit of the approved
      experience spine (INC-3 plus three deferrals). Four calls, taken together so the
      inbox absorbs them in one design round rather than across three future redesigns:
      (1) GR-3 sensitive-topic holds get a DISTINCT "held for your approval" card class
      (DS-5 v4) — visible, counted in "N of M", never batch-approvable, ReasonLine names
      the hold — chosen over a lighter ReasonLine-only variant or inverting the
      veto-window card, because a hard guardrail deserves an unmistakable, non-confusable
      surface (resolves INC-3; UI-7 v3, UI-29 v2). (2) TL2 (full autopilot) inbox
      semantics are designed NOW rather than deferred to AUT-2/P1 — at TL2 the inbox is
      mostly silent and its only content is GR-3 holds + publish failures + the streak,
      so designing the hold effectively designs the TL2 inbox; consistent with DEC-8's
      TL1-aware-now rationale (UI-7 v3, UI-16 v2). (3) An in-app ACTIVITY & NOTIFICATIONS
      center is added to the spine (new screen UI-67, flow UI-68 under UI-17 "the
      inspectable brain") — the founder-facing realization of VAL-3 "everything auto-done
      is logged and visible", aggregating auto-published actions (PUB-3 publish log),
      publish failures, and channel re-auth prompts (UI-26) — each surfaced only when the
      founder must act. Its shell affordance lives in the TOP CHROME, not the left nav,
      and shows a count ONLY when founder action is required — reconciling the addition
      with UI-6's "only Inbox carries a nav chip" rule rather than breaking it (UI-6 v4).
      (4) UI-45 "cancel with dignity" is given an explicit screen node (the cancel
      section of UI-12), closing the one flow that cited no surface. The
      offline-connectivity posture beyond UI-5's resumable upload stays P0-minimal and is
      subsumed by the actionable-alerts model (no separate global offline mode at P0).
      Reaches approved after the Product-Designer challenger pass of this round.

  DEC-13:
    v: 1
    date: 2026-07-18
    by: founder (shpin.p@diffco.us)
    binds: [Q-12, G-1, G-2, G-3, G-4, G-5, GEN-1, APR-1, PUB-1, AUT-1]
    title: Close the goal-honesty pass — resolve Q-12 + adopt the outcome tier
    statement: >-
      Completes the DEC-11 pass now that the cortex outcome-validation tier has shipped
      (Steward pins cortex v0.20.1). Two moves. (1) RESOLVES Q-12 — closes the G-1/G-4/G-5
      capability gaps by wiring the generate→approve→publish core loop to those goals:
      GEN-1 and APR-1 gain `serves` G-1 + G-5; APR-1 and AUT-1 gain `serves` G-4; PUB-1
      gains `serves` G-5. Each touched requirement bumps a version (GEN-1/APR-1/PUB-1/
      AUT-1 → v2) and cascades a re-pin of the coverage `against` lists that reference it;
      G-1/G-4/G-5 coverage flips partial→complete because the loop is now on-path, not
      relied on in prose. (2) ADOPTS the outcome tier — every Steward goal is a field-metric
      goal, so each now declares an `outcome` assertion (status in-progress: no cohort
      measurement exists yet). This STRUCTURALLY gates a goal's `achieved` on a field
      measurement, not on build alone, replacing the DEC-11 prose caveat with an
      engine-enforced tier. Net honest state: coverage = capability decomposition (complete
      for all five), outcome = field validation (in-progress until cohort data). Recorded
      per HITL (a requirement/goal change): the founder authorized both moves on 2026-07-18.
      CHALLENGE EVIDENCE (compass lens): specs/challenges/goals-2026-07-18-r3.md (pass —
      serves-closures on-path, against-pins reconciled, outcome tier honest, INC-2
      structurally closed), continuing the r1→r2 chain recorded on DEC-11.

  DEC-11:
    v: 1
    date: 2026-07-18
    by: founder (shpin.p@diffco.us)
    binds: [INC-2, Q-12, G-1, G-2, G-3, G-4, G-5]
    title: Goal coverage is a capability claim, not an outcome promise
    statement: >-
      Resolves INC-2 (goal-coverage backfill overstated achievability). Adopted via
      the founder's two AskUserQuestion choices on 2026-07-18. (1) HONESTY POLICY:
      every goal here is a field-measured OUTCOME/METRIC goal, so `coverage: complete`
      asserts only that the CAPABILITY DECOMPOSITION is complete — no capability the
      metric plausibly needs is missing — and explicitly NOT that the metric target
      will be met; metric achievement is empirical, validated by cohort measurement,
      and the causal leap is named against each goal's risks (R-1/R-5, A-5, R-3). (2)
      GRANULARITY: coverage reasoning is argued requirement-by-requirement so the
      `against` pin is auditable; every pinned ID must be placed in the causal chain.
      (2b) CRITICAL-PATH rule (added after the r1 challenger fail): `complete` requires
      the serving set to pin every capability on the metric's CRITICAL PATH; omitting a
      step is a gap even when another goal decomposes it, because the roll-up has no
      goal→goal edge. The status split is DERIVED from this rule, not asserted: G-2
      (approval-rate, path ends at APPROVE) and G-3 (in-app time, an aspect property)
      are `complete` — their paths are fully pinned; G-1 (pay/stay — value delivery
      needs the loop, pins PUB but omits GEN+APR), G-4 (streak — pins GEN+PUB, omits the
      APR/AUT approve step), and G-5 (first live post — pins none of GEN/APR/PUB) are
      `partial`. The earlier r1 attempt kept G-1/G-4 `complete` on a "cross-goal reliance
      in prose" device; the challenger correctly ruled that the very prose-substitution
      INC-2 rejects, so all three critical-path gaps are now `partial`, tracked for
      closure as Q-12. The `serves`-edge audit found APR-2/4/6, CHT-3, BOT-2/3 serve G-2
      only weakly (file-level inheritance); left uncorrected as defensible, noted in G-2
      coverage. Coverage reasoning cites requirement IDs by causal role only — no
      restated parameters or priorities (the r1 low finding). (4) METHOD
      ESCALATION: the root cause is a Cortex gap — the roll-up models `achievable`
      (decomposed) and `achieved` (built) but has no OUTCOME-VALIDATION tier for a
      field-measured goal, so it would imply a behavioral metric is achieved when only
      capabilities are built. Raised as a change-request against the cortex method
      (capability-goal vs outcome-goal distinction); until it lands, the leap is
      carried in prose + risks here. CHALLENGE EVIDENCE (compass lens, mandatory for a
      goal-register reshape): specs/challenges/goals-2026-07-18-r1.md (fail — the
      G-1/G-4 coherence defect) → goals-2026-07-18-r2.md (pass — rule stated + statuses
      re-derived + altitude leak cleared).

  DEC-10:
    v: 1
    date: 2026-07-17
    by: founder (shpin.p@diffco.us)
    binds: [Q-8, Q-10, Q-11, NWS-1, NWS-6, DS-8]
    title: Resolve news-site open questions — URL strategy, theming, afterlife
    statement: >-
      Resolves the three DEC-9 open questions, amending NWS-1/NWS-6/DS-8.
      Q-8 (URL strategy): the news-page address is environment- and
      org-configurable — dev defaults to an app-domain path (zero-infra);
      prod defaults to a dedicated Steward-operated news domain (org slug);
      an org may choose its own news subdomain in Settings (NWS-6). Q-10
      (theming depth): the DS-8 org slots are name + logo + accent color
      ONLY — no per-org typography (keeps the template unmistakably calm,
      GR-7). Q-11 (URL afterlife): an article URL stays reserved and served
      as long as the org's account is active — reservation is a benefit of
      an active account, not held indefinitely for inactive ones (interacts
      with BIL-2 cancel and the SEC deletion policy).

