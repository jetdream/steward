kind: inconsistencies
prefix: INC
title: Inconsistency Register
status: approved

intent: >-
  Detected contradictions between artifacts are first-class persistent entries
  — never silently dropped. Lifecycle: open → resolved (an entry is never
  deleted; resolution is recorded). Open entries are mandatory reading for any
  change touching the IDs they reference; scripts/docs-check.mjs reports the
  open count.

items:
  INC-13:
    v: 1
    status: open
    binds: [XH-12, UX-3, ONBS-6, GENS-8]  # DEC-48: ONBS-6 v3 adds the delivery-channel half
    title: XH-12 defines the home's three shapes but never the transition between them
    statement: >-
      Detected 2026-07-26 (Phase F audit, F1 run A; registered as an ID during the
      job-runner delta re-challenge, which found the delta deferring coherence to a
      markdown finding with no graph node). XH-12 specifies day-one / steady /
      quiet and states that a shape change alters "density and content, NEVER
      layout" — but nothing specifies WHEN one becomes another, and
      onb-onboarding.yaml explicitly defers the UI-detail pass over the day-one
      screens. The implementation therefore chose its own condition
      (isDayOne = readyForFirstDrafts !== true), and the observed consequence was
      severe: a successful ingest flipped the predicate, the home left day-one
      shape in the same refresh that produced 21 Memory entries, the findings card
      never rendered, and the founder was shown "0 weeks of steady presence /
      That's everything. Nothing is waiting on you." A BETTER ingest produced a
      WORSE screen. GENS-8 sharpens the gap by decoupling the predicate from
      generation: the shape would otherwise flip while generation is still in
      flight and Ready is empty (an empty state against VAL-6/DS-6). ONBS-6 v3
      carries the interim rule — the day-one narration persists until the first
      drafts land or visibly fail, and is REPLACED when they later arrive — but the
      transition itself is XH-12's to own. ONBS-6 v3 additionally records the half
      this entry did not name (DEC-48, round-7 panel): a transition condition needs
      an OBSERVATION CHANNEL. The client neither polls nor subscribes and the
      onboarding refresh does not invalidate the Ready stack, so drafts landing a
      minute after the predicate flips are never fetched — whatever condition
      XH-12 settles on, it must be observable by an open session without a manual
      reload.
      Resolution: amend XH-12 with the shape-transition condition, then repair the
      code against it; the ONBS-6 v3 rule is the behavioural half and must stay
      coherent with whatever XH-12 settles.
  INC-12:
    v: 1
    status: open
    binds: [VIS-1, VAL-6, ONB-6, ONBS-6, GEN-1]
    title: The built product cannot produce content unaided — the vision's central verb is unimplemented
    statement: >-
      Detected 2026-07-26 (Phase F audit, F0b/F1). VIS-1 promises an AI employee
      that "plans and writes its donor-facing content"; VAL-6 forbids "empty
      states that ask the founder to create from scratch"; ONBS-6's acceptance
      states that an org giving only name + email "receives first drafts in that
      session". None of this holds. The client has ZERO callers of
      content.planAndDraft, topics.identify or strategy.autoDraft, and the chain
      no-ops regardless (planner.ts:148 returns [] on an empty agenda). The only
      reachable content path is approval.compose, where the founder writes the
      post themselves. Confirmed live against real Gemini: a fresh org whose
      website yielded 21 accurate Memory entries produced no draft, and chat
      declined the request "write a post about Monty" as "our strategy for
      writing posts isn't set yet". Evidence and screenshots:
      design/walkthroughs/audit-2026-07-26/.
  INC-11:
    v: 1
    status: open
    binds: [ARC-3, GEN-1, PRO-4]
    title: ADR-0003 provisioned a Job/Queue port and nothing implements it — Steward has no heartbeat
    statement: >-
      Detected 2026-07-26 (Phase F audit). ADR-0003 specifies a Job/Queue port
      (cron + work queues, pg-boss on Postgres) as one of the environment-selected
      adapter seams. No implementation exists — no scheduler, cron, queue or timer
      anywhere in backend/ or shared/. Consequence: Steward can only act while a
      founder is looking at it, so the founding insight ("she shows up on her
      own") is structurally unreachable, and DEC-24's shared proactive-interruption
      budget (PRO-4) cannot be built. Resolving INC-12 with a UI button would NOT
      close this: a button is still a tool the founder operates, which vision.md
      names as the failure mode this persona abandons. RESOLUTION AUTHORIZED by
      DEC-44 clause (1): the Job/Queue port is implemented, not deferred. Stays
      open until the substrate lands and Steward is observed changing state
      between two sessions with no interaction.
  INC-10:
    v: 1
    status: open
    binds: [STR-4, STRS-4, MEM-1, GR-8]
    title: Strategy section (c) merges taboos with style rules, inverting the org's own instructions
    statement: >-
      Detected 2026-07-26 (Phase F audit, F1 run A). STRS-4 derives section (c)
      as the platform guardrail layer plus the active Memory overlay, and renders
      the whole under the founder-facing heading "What I never do". The overlay
      contains BOTH taboo entries (never do X) and styleRule entries (do X this
      way), so positive instructions are presented as prohibitions. Observed live
      with real ingested data: an animal shelter was told Steward will never
      "Encourage adoption, fostering, and donation." The two kinds need separate
      presentation; only taboos belong under a never-heading.
  INC-9:
    v: 1
    status: open
    binds: [UX-1, US-1]
    title: The story register assumes a laptop; the experience register makes the phone the floor
    statement: >-
      Detected 2026-07-26 (Phase F audit). UX-1 v2 (decided-by DEC-19) states
      "the phone is the FLOOR — every founder action is available one-handed in a
      phone browser; desktop adds simultaneity, never exclusive capability". US-1's
      persona line reads "marketing-averse, time-poor, arriving on a laptop". The
      contradiction had a practical consequence: every Phase E browser check and
      the manual walkthrough ran at 1280px, so the specified primary surface was
      never judged by a human until this audit.
  INC-8:
    v: 1
    status: open
    binds: [DEC-16, AUT-1, AUTS-1]
    title: The built trust-level labels are not the ones DEC-16 mandates
    statement: >-
      Detected 2026-07-26 (Phase F audit, F2). DEC-16 clause (3) and the glossary
      entry for Trust Level both mandate the founder-facing labels "Ask me first /
      Publish with a heads-up / Run on your own", with the TL0/1/2 codes internal.
      All three strings are absent from the codebase; the build renders "I approve
      everything" / "Let the routine ones go" / "Run it" (client controls). The
      codes are correctly kept internal, so DEC-16's substance holds, but its
      prescribed wording does not. The built labels are arguably the better
      colleague voice — this is a choice between conforming the code and amending
      DEC-16, and needs a decision rather than being left divergent.
  INC-7:
    v: 1
    status: open
    binds: [US-19, ONBS-6]
    title: The demo seed fabricates both ends of the content loop, so no test could detect its absence
    statement: >-
      Detected 2026-07-26 (Phase F audit, F0b). backend/src/demo/seed.ts inserts
      content_item rows directly (the drafts) AND a channelVariant with
      deliveryState "published" plus a URL (the record). Nothing in the product
      writes either state: generation has no UI trigger (INC-12) and
      publishing.publish has no client caller, so publishLog can only ever return
      seeded rows. Every e2e spec that asserts a draft exists signs into the
      seeded org; the only two specs that start from a fresh signup assert no
      draft appears. US-19 ("the whole loop closes") therefore passes against
      fabricated data while being false for every real founder. The suite was
      structurally incapable of failing when the product could not write. LRN-30
      recorded this class of blindness on 2026-07-25 and it recurred the same
      week. Resolution requires a test that starts from a fresh signup and
      asserts a draft arrives unaided.
  INC-6:
    v: 1
    status: resolved
    binds: [ONBS-1, ACC-1]
    title: The approved ONBS-1 signup predates the Org⟂User identity model
    statement: >-
      Detected 2026-07-21 (ACCS design-gate challenge). ONBS-1 (approved
      2026-07-18) specifies signup as startSignup(name,email) -> Org, creating
      only the Org (DM-1) — the one-account-per-org shape DEC-30/DEC-32 reversed.
      The new identity model requires signup to also create a User (DM-15) and an
      owner Membership (DM-16); that transition (out of ACCS-1's "signed-in User
      with no membership" state) must be specified in an approved spec, not left
      implicit.
    resolution: >-
      ACCS-1 (this change) OWNS signup-time identity: it specifies that signup
      creates the (User, Org, owner-Membership) triple, layered on ONBS-1's Org
      creation, and ACCS depends-on ONBS. ONBS-1's prose ("-> Org") is
      stale-but-not-wrong (it still creates the Org; ACCS adds the identity
      half) and is flagged for reconciliation the next time the ONB spec is
      revised — tracked here, not silently dropped, and no re-gate of the
      approved ONB spec is forced by this reorg.
  INC-4:
    v: 1
    status: resolved
    binds: [SEC-7, DM-1]
    title: Multi-member orgs contradict the single-founder scope and persona
    statement: >-
      Detected 2026-07-21 (admin/management capability ideation). The founder
      requested that platform admin capabilities rest on an Org⟂User account
      model that allows MULTIPLE members per org. This contradicts scope.md's
      "Not in this product … multi-seat roles" non-goal and the users.md
      "Single account per org" Founder-Operator persona line. It is an explicit,
      deliberate scope expansion (not an oversight), so it is recorded and
      resolved rather than blocked.
    resolution: >-
      DEC-30 reverses the multi-seat non-goal: an Org has one or more member
      Users with roles (owner + members), and the persona generalizes to "org
      members". scope.md and users.md amended in the same change. The internal
      platform-staff role is distinct (DEC-32), not an org member.
  INC-5:
    v: 1
    status: resolved
    binds: [VAL-3, SEC-11]
    title: Internal-only impersonation logging contradicts VAL-3 "logged and visible"
    statement: >-
      Detected 2026-07-21 (admin/management capability ideation). The chosen
      support-impersonation posture — staff act-as-org logged internally but NOT
      surfaced to the founder (DEC-32) — contradicts VAL-3's "everything
      auto-done is logged AND visible". VAL-3 is the product's core trust
      promise, so the tension is recorded as a first-class inconsistency rather
      than absorbed silently.
    resolution: >-
      DEC-31 records a deliberately NARROW carve-out: staff act-as actions are
      fully audited internally (reason-gated, attributed — SEC-11) but their
      attribution is not surfaced to the founder, while the RESULTS remain
      visible in the founder's own surfaces. VAL-3 → v2 carries the carve-out
      inline. Residual trust risk acknowledged; mitigations in DEC-31.
  INC-3:
    v: 1
    status: resolved
    binds: [GR-3, UI-7, UI-29, DS-5]
    title: Guardrail GR-3 had no founder-facing manifestation in the experience spine
    statement: >-
      Detected 2026-07-18 (founder-requested pre-UI reconciliation audit of the
      approved experience spine). GR-3 — a hard, top-of-precedence guardrail — forces
      a sensitive-topic item to human approval REGARDLESS of Trust Level. At TL1/TL2
      the inbox otherwise auto-publishes, so GR-3 requires a distinct founder-facing
      state (an item that WOULD have auto-published but was held for approval, with the
      reason shown). The approved spine referenced GR-3 only in EXT-2's backend body;
      no screen, flow state, or DS component manifested it, and — unlike the APR-2 /
      NWS-6 / TL2 conscious-deferral precedents — it was not recorded as a deliberate
      omission. A hard guardrail with no experience manifestation would surface late,
      on the inbox (UI-7), the most-designed screen.
    resolution: >-
      DEC-14 designs the manifestation: a distinct "held for your approval" card class
      (DS-5 v4, GR-3), counted in the inbox and never batch-approvable, with a
      ReasonLine naming the sensitive-topic hold (UI-7 v3, UI-29 v2). Vetted in the
      same round by the Product-Designer challenger.

  INC-2:
    v: 1
    status: resolved
    binds: [G-1, G-2, G-3, G-4, G-5]
    title: Goal coverage overstated achievability (register-granular sufficiency)
    statement: >-
      Detected 2026-07-18 (founder review of the 49e70df goal-coverage backfill).
      Every goal carried `coverage: status: complete` whose `reasoning` argued
      sufficiency at REGISTER granularity ("decomposed across billing (BIL),
      publishing (PUB)…") while the `against` pin listed 19–45 INDIVIDUAL
      requirement IDs — so the sufficiency claim was asserted, never demonstrated at
      the level it pinned, and no missing capability could surface. Two consequences:
      (1) the lint trusts `coverage: complete` at face value, so the graph would flip
      each goal to `achievable` on the strength of unauditable prose the moment specs
      land; (2) all five are OUTCOME/METRIC goals, and `complete` conflated CAPABILITY
      completeness with OUTCOME achievement — a leap no requirement set can guarantee.
      Writing the argument at requirement granularity then exposed a concrete false
      claim: G-5 (post live in 48h) pinned NONE of the generate→approve→publish chain
      its own metric requires.
    resolution: >-
      DEC-11 adopts the capability-vs-outcome honesty policy: coverage on a metric
      goal is rewritten requirement-by-requirement, `status: complete` is scoped to
      "capability decomposition complete — not the metric will be met" with the
      outcome-leap named against its risks, and status is DERIVED per-goal from a
      stated critical-path rule. G-1, G-4, and G-5 were downgraded to `partial` (each
      omits a step of the generate→approve→publish core loop its metric runs through;
      gaps tracked as Q-12); G-2 and G-3 stay `complete` (their metric paths are fully
      pinned). The underlying method gap (no outcome-validation tier) is raised against
      cortex (DEC-11).

  INC-1:
    v: 1
    status: resolved
    title: Vision defined an activation metric absent from PRD goals
    statement: >-
      Detected during PRD v0.3 decomposition (2026-07-12). Vision v0.2 lists
      activation ("first approved post live within the first session's 48
      hours") and churn (<3%) as success metrics; PRD §2 goals (G1–G4) omitted
      both, so the two normative documents disagreed on the goal set.
    resolution: >-
      Activation promoted to G-5; churn folded into G-1. Vision's metrics
      section now points to goals.yaml.
