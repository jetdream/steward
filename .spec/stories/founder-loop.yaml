kind: stories
prefix: US
title: Founder-loop stories — the manual-evaluation walkthrough, made normative
status: approved
serves: [UX-1, UX-3, UX-6, AUT-3, APR-1, DS-4]
intent: >-
  The founder-facing things a person will actually DO, each with what they should
  observe. Founded by DEC-43 to activate the `@validates` channel, which had no
  legal target in this project and left every user-visible flow verified only at
  the unit tier.

  This register is the NORMATIVE form of the manual-evaluation walkthrough that
  closes the UI phase: `MANUAL-EVAL.md` is rendered FROM these items, never
  maintained beside them, so the script a human follows and the script a machine
  runs cannot drift. Each story's `acceptance` is one sentence that is true or
  false by observation; its e2e spec under `client/e2e/` carries
  `@validates US-n` and asserts the same sentence.

  Scope discipline (VAL-6, the over-structure lens): a story earns its ID only if
  an e2e spec cites it. Stories accumulate as the UI is built — an increment that
  ships a founder-visible flow adds its story in the same commit — rather than
  being reconstructed at the end.

  Challenged 2026-07-25 (over-structure lens, a new register kind + prefix):
  verdict PASS at r1-fixed, record
  .spec/specs/challenges/stories-founder-loop-2026-07-25-r1.md. The engine does
  not design-gate a stories register the way it gates a spec, so the provenance
  lives here and in DEC-43 rather than in a `challenge:` block. The round's two
  structural findings shaped what you see: the layer is routed from the SDLC's
  Phase B (step 2b) so stories actually accumulate, and MANUAL-EVAL.md is
  generated by `npm run manual-eval` with a staleness check in the gate — the
  "cannot drift" claim is a mechanism, not an assertion.

  What belongs here: RENDERED-STATE facts a unit test cannot see — focus landed
  where it should, a region is reachable, a control is one gesture away, a card
  is visually distinguishable from its inverse. What does not: pure policy
  (a `@verifies` unit test owns that) and visual taste (the human's call).
items:
  US-1:
    v: 1
    serves: [UX-1, UX-3]
    persona: >-
      Maria, the founder — marketing-averse, time-poor, arriving on a laptop.
    title: The home always presents the same skeleton
    statement: >-
      Whatever shape the home is in — day one, the weekly visit, or the quiet
      earned-autonomy state — the founder sees the same chrome and the same
      region order, so their spatial memory keeps working (DEC-18).
    acceptance: >-
      The chrome shows Pause, the wordmark, the four plain-labeled Look-inside
      links, Controls and Compose; the regions below appear in the order pinned →
      Ready → conversation → terminus; and no Look-inside link carries a badge,
      count or dot.
  US-2:
    v: 1
    serves: [UX-1]
    persona: >-
      Maria, opening a glass-wall view on her laptop mid-visit.
    title: A summoned view opens beside the home without losing her place
    statement: >-
      On desktop the pane opens BESIDE the home column — the stream stays
      present and dimmed with its place kept, rather than being replaced or
      covered (DEC-19).
    acceptance: >-
      With a pane open the home column is still visible to its left at its full
      readable width, the stream is dimmed but not hidden, and the pane occupies
      the added width without overlapping the column.
  US-3:
    v: 1
    serves: [UX-3, APR-1, DS-4]
    persona: >-
      Maria, who has a sensitive draft held for her while she reads something else.
    title: A held card stays reachable while a pane is open
    statement: >-
      The pinned needs-you zone — GR-3 holds, publish failures, channel re-auth —
      stays live while a summoned pane is open on desktop: undimmed, clickable,
      keyboard-reachable, and still announcing. It is the one region a pane never
      takes away (XH-12).
    acceptance: >-
      With a pane open on desktop, the pinned card is at full opacity, its button
      takes keyboard focus, and a click at its centre lands on that button rather
      than on the pane or a backdrop.
  US-4:
    v: 1
    serves: [UX-1, DS-4]
    persona: >-
      Maria, dismissing a view to get back to her stack.
    title: Leaving a pane returns her exactly where she was
    statement: >-
      One gesture closes a summoned pane — the back control or Escape — and
      focus returns to the control that opened it, so keyboard and
      screen-reader users are not dropped at the top of the document.
    acceptance: >-
      Pressing Escape with a pane open closes it, returns focus to the exact
      control that opened it, and leaves no region inert.
  US-5:
    v: 1
    serves: [AUT-3, UX-6]
    persona: >-
      Maria on her phone, mid-way through reading a draft, who wants everything
      to stop right now.
    title: The kill switch is always one gesture away, even under a takeover
    statement: >-
      Pause is reachable in ONE gesture at every trust level and in every state —
      including with a full-screen pane open on a phone, which is where a
      takeover could most plausibly bury it (AUT-3 is a hard guardrail).
    acceptance: >-
      At phone width with a pane open, the chrome is still visible above the
      takeover and the Pause control takes keyboard focus without dismissing the
      pane first.
  US-6:
    v: 1
    serves: [ONB-1, ACC-1]
    persona: >-
      Maria, arriving for the very first time with nothing but her
      organization's name and her email address.
    title: Two fields is the whole of signing up
    statement: >-
      The doorstep (XO-6) asks for an organization name and an email and nothing
      else — no wizard, no checklist, no EIN gate — and one submit lands her in
      her own home with her organization's name on it (ONB-1: nothing blocks on
      completeness). Signing out returns her to the doorstep.
    acceptance: >-
      The doorstep shows exactly two inputs and a plain-language consent
      sentence; submitting them lands on the home whose greeting carries the
      typed organization name; and signing out returns to the doorstep.
  US-7:
    v: 1
    serves: [AUT-3]
    persona: >-
      Maria, who hit Pause yesterday and wants to be certain it is still holding.
    title: Pause is the real switch, not a button that looks like one
    statement: >-
      Pausing writes to the org's autonomy state, not to the page: the chrome
      comes back paused after a full reload. A kill switch that forgets when the
      tab closes would satisfy every visual check and stop nothing (AUT-3 is a
      hard guardrail).
    acceptance: >-
      After pressing Pause the chrome offers Resume, that state survives a full
      page reload, and pressing Resume returns the chrome to offering Pause —
      also across a reload.
